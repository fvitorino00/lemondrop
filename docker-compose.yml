# lemondrop — document-search retrieval stack
#
# ── Architecture ──────────────────────────────────────────────────────────────
# Three services make up the retrieval stack: two stateless inference workers
# and the orchestrator that fronts them.
#
#   embedder  — stage 1. Turns text into a 384-dim vector (bge-small-en-v1.5,
#               CLS pooling). Query and passage are both embedded here.
#   reranker  — stage 2. Scores (query, passage) pairs and orders the stage-1
#               candidate list (bge-reranker-base, rank pooling).
#   api       — the orchestrator. Stands in front of both workers and is the
#               single door to the outside world.
#
# The two workers share the same published image,
# ghcr.io/ggml-org/llama.cpp:server. Neither has a Dockerfile and neither
# has a `build:` section, because the operator verified that image runs
# correctly and CPU-only on this machine. It is a third-party artifact,
# so it is consumed as published. `api` IS different in kind: it is our
# own application code, not a published upstream image. That difference
# used to be expressed as a build, and it is now expressed as a PULL of a
# digest-pinned image that CI published — see the `api:` block, which has
# no `build:` key at all.
#
# ── One published port, on `api` ──────────────────────────────────────────────
# Of the three RUNTIME services, this file publishes exactly ONE `ports:` key,
# and it is on `api`. The workers do not publish one, which is a design decision
# rather than an oversight:
#   * The workers are internal. They exist to be called by the API over the
#     compose network, not by anything on the host.
#   * A published port is a public door. Every door is attack surface, and the
#     whole point of the api is to be the ONLY thing a host client (or the
#     internet, once published) can reach. Its host port is ${API_HOST_PORT},
#     and it is the sole publisher.
#   * Containers reach each other by SERVICE NAME over compose's default
#     network, via Docker's embedded DNS. The API calls
#     `http://embedder:8080` and `http://reranker:8080`. No published port is
#     needed for that, and none is used. Both workers listen on 8080 inside
#     their own network namespaces, so the two are different sockets and nothing
#     collides; the DNS name — not the port number — is what tells them apart
#     from the API's side.
#
# The one other `ports:` key in this file belongs to the profile-gated `postgres`
# dev database at the bottom, and it is bound to 127.0.0.1 only. Loopback is not
# a published door: nothing off this host can reach it, so it does not weaken the
# claim above. It exists purely so `psql` on the workstation can attach. That
# distinction is why the same rule that produced "exactly one door" still holds —
# see the postgres block for the full argument.
#
# ── depends_on and container naming ───────────────────────────────────────────
# `api` declares `depends_on` on both workers with `condition: service_healthy`.
# The reason is not tidiness: llama.cpp answers /health with 503 while it is
# still reading the GGUF off disk and loading it into memory, which on this
# CPU-only machine takes tens of seconds. Plain `depends_on` waits only for a
# container to be STARTED, which is not the same as ready — the API would come
# up against two unready dependencies. `service_healthy` makes compose wait for
# both healthchecks to actually pass, so the API starts only once the funnel
# beneath it can serve.
#
# There is no `depends_on` between embedder and reranker: they are independent,
# neither calls the other, so ordering them would encode a lie about the
# architecture. And there is no `container_name:` anywhere — compose generates
# names, which keeps scaling and parallel project copies conflict-free.
#
# ── Models are loaded BY PATH, not by repo name ───────────────────────────────
# Both workers are started with `-m /models/<file>.gguf` rather than by naming a
# HuggingFace repo. The reason: naming a repo resolves the weights through the
# container's own cache at /root/.cache/huggingface/, which is NOT the bind
# mount — so ./models:/models was not serving the model, and persistence across
# a container rebuild was not actually guaranteed. Loading by path makes /models
# the single source of truth for the weights and makes scripts/fetch-models.sh
# the single provisioning path.
# Consequence: scripts/fetch-models.sh MUST be run before the first
# `docker compose up`. A model missing from /models now fails loudly at startup
# instead of being silently re-downloaded into a throwaway cache.
#

# ── Configuration ─────────────────────────────────────────────────────────────
# Every ${VAR} below is interpolated by Compose from the `.env` file sitting
# beside this compose file, which you create with:  cp .env.example .env
# If `.env` is absent Compose substitutes an empty string and warns, so run
# that copy before the first `docker compose up`.

services:

  # ── embedder ───────────────────────────────────────────────────────────────
  # Stage 1 of the funnel. Loads bge-small-en-v1.5 as Q8_0 and serves embeddings
  # on demand. `--pooling cls` is REQUIRED for this model family and yields
  # exactly EMBEDDING_DIM=384 dimensions; the vector store index is sized to
  # match. `--alias` is the name the API will request models by, so it is taken
  # from .env rather than hardcoded here.
  embedder:
    image: ghcr.io/ggml-org/llama.cpp:server

    # Exec-form argv. The image's ENTRYPOINT is the llama.cpp server binary, so
    # these are server flags, not a command to run inside.
    #   -m            load the GGUF from the bind-mounted /models path
    #   --embedding   run as an embedding server
    #   --pooling cls CLS pooling -> 384-dim vectors (bge-small-en-v1.5)
    #   --alias       model name the API addresses it by
    #   --port        port inside the container's own network namespace
    command:
      - "-m"
      - "/models/bge-small-en-v1.5-q8_0.gguf"
      - "--embedding"
      - "--pooling"
      - "cls"
      - "--alias"
      - "${EMBEDDER_MODEL_ALIAS}"
      - "--port"
      - "${EMBEDDER_INTERNAL_PORT}"

    # Persist downloaded weights on the NATIVE ext4 filesystem at the project
    # root (/home/zaratustra0/Projects/lemondrop), NOT under /mnt/c. WSL mounts
    # /mnt/c as slow 9p; loading a model from there costs minutes per start.
    # Bind-mounting keeps weights out of a docker volume so they survive
    # `docker compose down -v` and are inspectable with ordinary tools.
    volumes:
      - ./models:/models

    # Survive host reboots and crashes, but respect an explicit `stop`.
    restart: unless-stopped

    # Memory bound — see the reranker block for the full OOM history
    # (docs/verification-milestone-3.md §12.3). Short form: three kernel
    # OOM kills of llama-server on a ~194Mi host; the dominant term is
    # fixed model weights plus the llama.cpp runtime, not KV cache. The
    # embedder's GGUF is ~35 MiB (far below the reranker's 289.8 MiB), so
    # 512 MiB is generous headroom for a healthy worker while bounding a
    # runaway. The real fix was capacity (t3.small); this is a safety net.
    mem_limit: "512m"

    # The upstream image ALREADY ships a HEALTHCHECK against port 8080. We
    # restate it explicitly rather than inherit it silently, for one reason:
    # this URL is hardcoded to 8080 on purpose. The image's built-in probe is
    #   HEALTHCHECK CMD [ "curl", "-f", "http://localhost:8080/health" ]
    # so if this probe used ${EMBEDDER_INTERNAL_PORT} and someone ever changed
    # that variable, the image's inherited probe would break while ours silently
    # drifted from reality. Keeping 8080 literal keeps both probes agreeing, and
    # keeps 8080 a documented constraint of the upstream image.
    #
    # This is safe for BOTH services: each container has its own network
    # namespace, so `localhost:8080` inside the reranker is a different socket
    # from `localhost:8080` inside the embedder. Nothing collides; the DNS name
    # (embedder vs reranker) is what distinguishes them from the API's side.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      # Poll every 10s once the container is considered up.
      interval: 10s
      # A probe that has not answered in 5s is a failed probe.
      timeout: 5s
      # Tolerate 5 consecutive failures before marking the container unhealthy.
      retries: 5
      # Generous grace period. The FIRST run reads a GGUF off disk and loads it
      # into memory on CPU, which is slow and happens BEFORE /health answers.
      # During start_period a failing probe does NOT count against retries, so
      # this absorbs a slow cold start instead of restarting a booting model.
      start_period: 120s

    # Bound the on-disk log footprint. Without this, a long-lived inference
    # service's json-file logs grow without limit and fill the host disk.
    logging:
      driver: json-file
      options:
        # Rotate at 10MB per file...
        max-size: "10m"
        # ...keeping at most 3 files (~30MB) per service.
        max-file: "3"

  # ── reranker ───────────────────────────────────────────────────────────────
  # Stage 2 of the funnel. Loads bge-reranker-base as Q8_0 and scores candidate
  # pairs. `--pooling rank` is REQUIRED here (not cls): a reranker emits one
  # relevance score per input pair rather than a vector, and the llama.cpp server
  # expresses that as rank pooling over the --embedding code path.
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server

    # Same exec-form argv. Differences from the embedder, all load-bearing:
    #   -m             load the GGUF from the bind-mounted /models path
    #   --parallel 1   ONE inference slot, not the default four — see below
    #   --reranking    scoring mode; without it the server answers embeddings
    #   --embedding    still required — it is the code path rank pooling rides on
    #   --pooling rank one score per pair, not a vector
    #
    # ── `--parallel 1`, AND WHY FOUR IS THE WRONG NUMBER HERE ─────────────────
    #
    # WHAT THE FLAG DOES. `--parallel N` sets how many independent inference slots
    # the server keeps open at once. A slot is a concurrent scoring context, and
    # each one needs its own context's worth of KV cache, so the cache the server
    # reserves scales with SLOTS × CONTEXT — not with the model alone. Two models
    # on disk are two fixed costs; the slot count is the knob that multiplies one
    # of them, and it is the only one here that multiplies anything at all.
    #
    # WHY FOUR WAS WRONG. llama.cpp's default is four. That default was never
    # revisited when this exact container moved from a 16Gi workstation to a
    # 913Mi `t3.micro` with no swap and roughly 194Mi available — the argv was
    # carried across hosts unchanged, so it kept asking for the memory profile of
    # the machine it was written on. Four slots' worth of KV cache does not fit in
    # ~194Mi alongside two resident models and the API, and llama.cpp says so
    # itself before the model has finished loading ("failed to fit parameters to
    # free system memory"). A reranker that cannot hold its own cache dies
    # mid-request, which the API sees as a connection reset and reports as 502.
    # The memory has to come from somewhere; four slots was the wrong answer to a
    # question nobody had asked at the size this host actually is.
    #
    # CONFIRMED LOCALLY, not assumed. Before this flag the running server logged
    #     initializing, n_slots = 4, n_ctx_slot = 512, kv_unified = 'true'
    # and after it logs
    #     initializing, n_slots = 1, n_ctx_slot = 512, kv_unified = 'false'
    # so the reserved KV falls from four contexts to one while per-slot context is
    # untouched. Note kv_unified flips too: at four slots the build unifies the
    # pool into one shared buffer, and at one slot there is nothing to unify. The
    # saving is real and it is measurable, not a guess.
    #
    # ── WHY 1 IS NOT A FUNCTIONAL REGRESSION HERE ──────────────────────────────
    # A single slot serves one request at a time, so the only thing lost is
    # CROSS-request concurrency — and this application does not use it. /search
    # issues exactly ONE rerank call per request (a single `_post_upstream` to
    # /v1/rerank in api/app/main.py, no fan-out, no gather), so a second slot
    # would have nothing to serve while the first was busy. The concurrency the
    # default of four was buying here was idle capacity, paid for in resident
    # memory on every request.
    #
    # WITHIN a request nothing is dropped. All documents are still scored and all
    # of them still come back; they are scored sequentially rather than several at
    # a time. The result set is identical — only the order in which the CPU visits
    # the candidates changes.
    #
    # ── THE TRADE, STATED PLAINLY ─────────────────────────────────────────────
    # Sequential scoring RAISES LATENCY. That cost is accepted rather than
    # avoided: memory is the binding constraint on a 913Mi host, and a request
    # that fails is strictly worse than a request that is slow. A 502 is not a
    # faster answer, it is no answer. If this host is ever given enough memory to
    # hold several slots again, revisit this upward — with a measurement of what
    # one slot costs, not with the default, which is how four got here.
    #
    # ── WHY --ctx-size AND --batch-size ARE DELIBERATELY LEFT ALONE ───────────
    # These are the obvious next two knobs, and adding them here would be a
    # mistake dressed as thoroughness. The original comment here claimed
    # llama.cpp TRUNCATES over-long inputs rather than rejecting them — that
    # claim was wrong. llama.cpp REJECTS oversized input:
    #
    #   * CONFIRMED LOCALLY, not assumed. The server logs
    #     "initializing, n_slots = 1, n_ctx_slot = 512" (this block, lines
    #     197-199) — a 512-token default context. A 512-token context cannot
    #     silently score a 4002-token input as complete; it must reject it.
    #   * OBSERVED LIVE against the deployed service: POST /embed with
    #     1024 chars (514 tokens) and 8000 chars (4002 tokens) both returned
    #     HTTP 500 from the worker with
    #     "input (N tokens) is too large to process. increase the physical
    #     batch size (current batch size: 512)", surfaced by the API as a 502
    #     in ~0.16s. This is the first and only recorded observation of the
    #     behaviour and it appears in NO milestone or evidence document.
    #
    # So over-long inputs do NOT silently produce worse relevance scores —
    # they fail loud, fast, and traceably (502 from the API). The risk that
    # motivated leaving these flags unset ("silent relevance regression with
    # no failure to trace") does not exist.
    #
    # That said, both flags remain unset, and for a different reason: there
    # is still no MEASURED maximum input length in hand to size them against
    # — a corpus of real runbooks and the longest passage in it, not an
    # average. The rejection path is now understood and documented; sizing
    # --ctx-size / --batch-size against a measured corpus maximum is the
    # remaining open task, not a correctness fix.
    command:
      - "-m"
      - "/models/bge-reranker-base-q8_0.gguf"
      - "--parallel"
      - "1"
      - "--reranking"
      - "--embedding"
      - "--pooling"
      - "rank"
      - "--alias"
      - "${RERANKER_MODEL_ALIAS}"
      - "--port"
      - "${RERANKER_INTERNAL_PORT}"

    # Same bind mount, same native-ext4 rationale: this model is the larger of
    # the two and is the one whose slow re-read would hurt most.
    volumes:
      - ./models:/models

    restart: unless-stopped

    # Memory bound. THREE kernel OOM kills of llama-server were recorded
    # in this service's cgroup on a ~194Mi host with no swap
    # (docs/verification-milestone-3.md §12.3): anon-RSS 425504 / 428608 /
    # 437408 kB, RestartCount = 2. The reranker weights alone are 289.8
    # MiB — larger than the entire available memory before a single byte
    # of KV cache — and the dominant term is fixed weights plus the
    # llama.cpp runtime, not KV cache: --parallel 1 removed 71.5 MiB
    # (RSS 720.1 → 648.6 MiB) but the third kill (437408 kB) happened
    # AFTER that change. The fix that worked was capacity (resize to
    # t3.small, 2 GiB), not configuration.
    #
    # Sizing: observed RSS with --parallel 1 is 648.6 MiB. A healthy
    # worker must not be killed, so the bound sits above that with
    # headroom for spikes: 1024 MiB (~58% headroom over observed). One
    # worker must not starve a 2 GiB host, so the bound is well under it.
    # Combined worst-case (reranker 1024m + embedder 512m + api 512m =
    # 2 GiB) is the host size; expected usage (~850 MiB combined) leaves
    # headroom for the OS and Docker. This is a safety net, not the fix.
    mem_limit: "1024m"

    # Literal 8080, and for the same upstream-image reason as the embedder:
    # the published image hardcodes its own healthcheck to port 8080. Because
    # each container has an independent network namespace, this reranker
    # occupying 8080 alongside the embedder's 8080 is not a conflict. It is
    # also why RERANKER_INTERNAL_PORT must stay 8080 in .env.example.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Same cold-start allowance as the embedder; this model is bigger.
      start_period: 120s

    # Same log bounding, same reason.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── api ────────────────────────────────────────────────────────────────────
  # WHY THIS IS THE ONLY SERVICE WITH A PUBLISHED PORT
  # The embedder and the reranker are internal workers. They do one thing each,
  # they hold no state, and nothing on this host has any business calling them
  # directly. Publishing them would put two more doors on the machine for no
  # benefit — every published port is attack surface, and a published llama.cpp
  # server is a published GPU/CPU inference endpoint.
  #
  # So the topology is: exactly one door (this service), and the workers are
  # reachable only from inside the compose network, by SERVICE NAME. The API
  # calls `http://embedder:8080` and `http://reranker:8080`; Docker's embedded
  # DNS resolves those names on the default network. No publishing is involved
  # on that path, and none is needed — which is why the two services above have
  # no `ports:` key and must not grow one.
  #
  # WHY depends_on USES condition: service_healthy
  # Plain `depends_on` only waits for a container to be STARTED. Started is not
  # ready. llama.cpp answers /health with 503 while it is still reading the GGUF
  # off disk and loading the model into memory — on this CPU-only machine that
  # takes tens of seconds. With plain depends_on the API would come up first,
  # see two unready dependencies, and (correctly) report degraded until the
  # models finished loading. `condition: service_healthy` makes compose wait for
  # both workers' healthchecks to actually pass, so the API is only started once
  # the funnel beneath it can genuinely serve. This is the one place where
  # depends_on encodes a real fact about the system rather than a convention.
  #
  # The API is stateless in this phase: no volumes, no database. There is nothing
  # for it to persist, so there is nothing to mount.
  api:
    # ── NO `build:` KEY. IT IS GONE, DELIBERATELY (M4 Stage 5) ─────────────────
    # This service used to carry `build: ./api`. It does not any more, and the
    # reason is not tidiness — it is a provenance failure that only a `build:`
    # key makes possible.
    #
    # `scripts/boot.sh` is not the script that runs on the host and is not
    # authoritative for this decision. The authoritative one is the boot script
    # inlined as `user_data` in `infra/compute.tf`, and its step 6 is
    # (`infra/compute.tf:552-554`):
    #
    #     docker compose pull embedder reranker 2>&1 | tee -a "$LOG_FILE" \
    #       || log "WARNING: 'docker compose pull' failed; continuing with local build/cache"
    #     docker compose up -d --remove-orphans 2>&1 | tee -a "$LOG_FILE"
    #
    # Note what that is and is not. The pull is NAMED — `api` is not in it, and
    # per the comment at `compute.tf:545-549` that naming is deliberate. And
    # there is no `--build`. So the api's image is never fetched, and nothing
    # tells compose to build it. As long as a `build:` key existed, compose
    # filled that gap itself: when the named image is absent locally, a
    # `build:` key makes `docker compose up` build an image SILENTLY, from
    # whatever the clone at `/opt/lemondrop` happens to contain, and tag it with
    # the name in the `image:` line. No error, no warning, no line in the boot
    # log.
    #
    # That is precisely the failure this milestone exists to eliminate: a
    # deployment whose provenance cannot be stated. The stack comes up
    # healthy, the record names a digest, and nothing anywhere says "this is not
    # the image you deployed". `verify-deployment.sh` exists to make that
    # divergence visible — but a check that reports a divergence on every single
    # boot is not a check, it is a permanent amber light. Removing the cause is
    # strictly better than permanently reporting the symptom.
    #
    # With the key gone, the absent-image case has exactly one behaviour: the
    # `image:` reference below is PULLED, or the pull fails and the stack says
    # so. Both are loud. Neither is a mystery build.
    #
    # ── THE COST OF THIS, STATED PLAINLY ──────────────────────────────────────
    # `docker compose up --build` no longer builds this service. That is the
    # intended effect and it is not a regression to be worked around silently.
    #
    # A developer who wants their WORKING TREE running does this instead — the
    # build context is `./api` and the Dockerfile is the repository's own
    # `api/Dockerfile`, so nothing here is a shell one-liner invented for this
    # commit:
    #
    #     # 1. point .env at the LOCAL name (gitignored, yours to edit)
    #     #      API_IMAGE=lemondrop-api
    #     # 2. build the image yourself, from this repo's api/Dockerfile
    #     docker build -t lemondrop-api ./api
    #     # 3. bring the stack up against that image
    #     docker compose up -d --no-build
    #
    # Step 2 is the only new step and it is the same `docker build` the old
    # implicit path was doing anyway — it is now written down instead of
    # inferred. `--no-build` in step 3 is redundant today, precisely BECAUSE the
    # `build:` key is gone; it is kept because it states the intent, and because
    # it keeps the command correct if a `build:` key ever returns.
    #
    # Leaving `.env` on the shipped digest instead is a supported and common
    # choice: `docker compose up` then PULLS and runs exactly the image CI
    # published. That is how you check whether your change is the problem.
    #
    # Name the image so it is identifiable in `docker images` and referenceable
    # by name rather than only by this project.
    #
    # ── WHY THIS IS PARAMETERISED (M4 Stage 4) ─────────────────────────────────
    # Stage 4 made this `${API_IMAGE:-lemondrop-api}` so Stage 5 could exist:
    # deploying an image CI published to GHCR means exporting
    # `API_IMAGE=ghcr.io/<owner>/lemondrop-api@sha256:<manifest digest>` — the
    # DIGEST, never the `:main` tag and never the `:sha` tag — so two deploys of
    # "the same" tag cannot resolve to different bytes. See the SHA tag
    # discussion in .github/workflows/release.yml: a tag is a mutable pointer,
    # and GHCR does not enforce immutability on one.
    #
    # ── WHY THE DEFAULT CHANGED (M4 Stage 5) — FAIL CLOSED ─────────────────────
    # The Stage 4 default was the bare name `lemondrop-api`. That is a Docker
    # HUB name. `lemondrop-api` is not qualified by any registry, so if API_IMAGE
    # is ever unset while there is no `build:` key above to satisfy it,
    # `docker compose up` resolves it as `docker.io/library/lemondrop-api` — a
    # PUBLIC image on Docker Hub that this project does not control, does not
    # publish, and has never tested. The service that answers on :8000 would
    # then be whatever somebody else pushed under that name. That is not a
    # hypothetical: `build:` IS gone as of this commit, so the default on this
    # line is now load-bearing whenever the stack is brought up — including on
    # the bootstrap's first boot — rather than merely a fallback, and the two
    # edits were one commit apart from being one bug apart.
    #
    # The default is therefore a FULLY-QUALIFIED, DIGEST-PINNED reference to an
    # image this project published, verified, and can pull anonymously:
    #
    #     ghcr.io/fvitorino00/lemondrop-api@sha256:0bdb7afa566b…42986
    #
    # There are now exactly TWO reachable values for this line:
    #
    #   API_IMAGE set   → whatever the operator set, and it was a deliberate act
    #   API_IMAGE unset → the one verified image, pinned to its manifest digest
    #
    # `docker.io/library/lemondrop-api` is reachable from NEITHER. The silent,
    # uncontrolled substitution is gone; what remains is a loud one.
    #
    # WHY THAT IS "FAIL CLOSED" AND NOT JUST "A BETTER DEFAULT". A default that
    # names a real image is a closed set: an unset variable cannot produce a
    # reference outside the two cases above. The residual failure mode is that
    # `.env` is missing, in which case the stack comes up on the published
    # image instead of on a local build — wrong for a developer, but LOUD,
    # attributable, and reversible. The alternative was an unset variable
    # silently producing an image from an account nobody here controls.
    #
    # ── WHAT THIS CHANGED, AND WHAT IT STILL DOES NOT CHANGE ───────────────────
    # WHAT CHANGED. With no `build:` key, this line no longer merely decides
    # what a locally-built image is CALLED — it decides what gets RUN. An unset
    # API_IMAGE is no longer rescued by a local build; it is a pull of the
    # digest above. The parameter stopped being cosmetic.
    #
    # WHAT DID NOT CHANGE. The `image:` line itself is byte-identical to the one
    # Stage 5 shipped, and the two edits were deliberately landed together: the
    # qualified digest below was already the default, so removing `build:` did
    # not have to also change this line to be safe.
    #
    # `.env.example` now ALSO ships this digest, not the local-dev name. That
    # was forced by the `build:` removal rather than chosen on its own merits:
    # boot step 4 is `cp .env.example .env`, so the template's value IS the
    # production value, and shipping `lemondrop-api` there would have sent every
    # fresh boot straight at `docker.io/library/lemondrop-api`. The local
    # developer's two-command override is documented beside that line in
    # `.env.example`.
    image: ${API_IMAGE:-ghcr.io/fvitorino00/lemondrop-api@sha256:8cf759f688daad5c5fbcc8a4efb6101de1de0f8efdf18c70e6aa7a8cd99f6110}

    # The only `ports:` key in this file. Host side from .env so the door can be
    # moved without editing this file; container side from .env to match the port
    # uvicorn binds (API_INTERNAL_PORT must stay 8000 — see api/Dockerfile).
    ports:
      - "${API_HOST_PORT}:${API_INTERNAL_PORT}"

    # ── WHY THIS BLOCK EXISTS ─────────────────────────────────────────────────
    # Without it the container receives NO DATABASE_URL at all. Compose reads
    # `.env` to interpolate the `${...}` in THIS file — it does not hand the
    # variables to the container as a side effect. The only `environment:` key
    # in this file used to be the one inside `postgres`, which configures that
    # container and nothing else. So `api` booted, found no DSN, logged
    # "database is not configured", and answered 503 on /health/ready — correct
    # degraded behaviour, and useless for anyone expecting a working local stack.
    # A rebuild does not fix this. Only this block does.
    #
    # ── WHY postgres:5432 AND NOT 127.0.0.1:5432 ──────────────────────────────
    # Both of those hosts are correct — for DIFFERENT consumers, and using the
    # wrong one fails in the most confusing way available:
    #
    #   alembic / pytest on the workstation -> 127.0.0.1:5432 (the published
    #     loopback port on THIS machine, see the postgres block)
    #   this container                    -> postgres:5432 (the service name,
    #     resolved by Docker's embedded DNS on the compose network)
    #
    # `127.0.0.1` inside a container is that container's own loopback. Nothing
    # listens on 5432 there, so a DSN copied verbatim from the host `.env` gets
    # `connection refused` from inside `api` while `psql` on the workstation
    # connects perfectly — a bug that reads as a broken database and is actually
    # a broken address. Hence the host is spelled `postgres` in DEV_DATABASE_URL
    # below — never the `127.0.0.1` that the host-side DATABASE_URL above and
    # ALEMBIC_DATABASE_URL both carry, because that address is correct for the
    # processes that read it and wrong for this one.
    #
    # ── PASSED THROUGH, NOT COMPOSED — `${DEV_DATABASE_URL:-}` ─────────────────
    # The container's DATABASE_URL is exactly what the operator's `.env` puts in
    # DEV_DATABASE_URL, and nothing else. Locally that value names the `postgres`
    # service on this compose network. The three DEV_DB_* keys below still
    # configure that postgres container and are NOT read by the api container, so
    # there is no second copy of a dev password to keep in sync, and this file
    # still contains no credential of its own — "this repo holds no database
    # credentials" stays a checkable property rather than a promise.
    #
    # The `:-` is load-bearing, and it is why the key is passed through instead of
    # being composed. A host that never sets DEV_DATABASE_URL — which is every
    # production host, because scripts/boot.sh copies this repo's .env.example over
    # .env and the template ships DEV_DATABASE_URL EMPTY — interpolates to an
    # empty string rather than to a plausible-looking DSN. That emptiness is what
    # lets the resolver in api/app/config.py fall THROUGH. `resolve_database_url`
    # returns DATABASE_URL unchanged whenever it is set AND non-blank, and
    # constructs no boto3 client at all when it is. Composing the DSN here meant
    # that on EC2 — where DEV_DB_USER/DEV_DB_PASSWORD/DEV_DB_NAME exist, because
    # that .env came from the same template — the container was handed a
    # well-formed, wrong DSN pointing at a `postgres` host that does not exist
    # there, the environment branch returned it unchanged, and the AWS branch was
    # unreachable dead code in the one environment that needs it. An EMPTY value
    # is not a fallback here; it is the only thing that makes the branch
    # reachable.
    #
    # Empty deliberately beats absent. The resolver treats an empty DATABASE_URL
    # as unset (`raw is None or not raw.strip()`), so the key is PRESENT in every
    # environment and simply means "nothing here" on EC2. The alternative —
    # omitting the key entirely when the variable is unset — yields an `api`
    # container whose environment differs between local and production with
    # nothing in this file to explain the difference, and no assertion anyone can
    # make about it. Explicitly empty is the version of that idea which can be
    # read, reviewed, and checked with one test.
    #
    # ── THE CREDENTIAL IS NOW VISIBLE TO `docker inspect` ─────────────────────
    # Once interpolated — locally, once DEV_DATABASE_URL is set — this DSN is a
    # plain environment entry on the container, so `docker inspect
    # lemondrop-<project>-api-1` prints the password in full to anyone who can
    # read the docker socket — and read/write access to that
    # socket is already root-equivalent on the host, so this discloses nothing
    # they did not already have. That is what makes it ACCEPTABLE HERE: the
    # credential guards a throwaway local database holding test documents on a
    # developer's own machine. The same line in front of a real secret would be
    # unacceptable — an RDS master password readable by any user in the `docker`
    # group is a production credential leak, and no argument about socket access
    # rescues it. Production therefore does not use this path at all.
    #
    # ── FOR THE DSN, THIS BLOCK IS DEVELOPMENT-ONLY ────────────────────────────
    # On EC2 the API resolves host and port from SSM
    # (`/lemondrop/dev/db/{host,port}`) and the credential from Secrets Manager,
    # through the instance role, so the password exists only in process memory.
    # That path IS implemented — in api/app/config.py, as
    # `resolve_database_url_from_aws` behind the `DatabaseUrlResolver` seam. It
    # is NOT implemented here. So the only thing this block owes production is
    # the empty DATABASE_URL below, which is what lets that function run instead
    # of short-circuiting on a local-shaped DSN it was never meant to see.
    #
    # Production therefore sets `DB_DSN_SOURCE` to `aws` in
    # /opt/lemondrop/.env after boot, and the `:-environment` default below is the
    # LOCAL choice: the DSN comes from the environment, or there is no DSN and the
    # API reports the database as unconfigured rather than guessing at one.
    # Production still does not work through this block; it works through the
    # resolver that this block exists to step out of the way for. And an EC2
    # container carrying this key is not evidence the DSN came from here — there it
    # is empty, which is exactly what the resolver needs to hear.
    #
    # ── WHY THERE IS NO `depends_on: postgres` HERE, DELIBERATELY ─────────────
    # The obvious thing to add next to a database URL is a dependency on the
    # database. On this service that would break production. The postgres service
    # is gated behind `profiles: [devdb]` (see its block), and
    # scripts/boot.sh:267 runs a bare `docker compose up -d --remove-orphans` on
    # EC2. A profile-gated service does not exist on that host, so
    # `depends_on: postgres` makes every compose call there fail with an
    # undefined-service error — taking down the verified Milestone 2 deployment
    # over a database EC2 is not running. So it is absent, on purpose.
    #
    # The operator starts the dev database explicitly, with the profile named:
    #     docker compose --profile devdb up -d postgres
    # and only then does /health/ready report the database as ok. Until then the
    # API serves and reports degraded, which is the honest answer.
    environment:
      DATABASE_URL: "${DEV_DATABASE_URL:-}"
      DB_DSN_SOURCE: "${DB_DSN_SOURCE:-environment}"
      # ── THE REGION IS A PASS-THROUGH, AND IT IS NOT A DEFAULT ─────────────────
      # The AWS SDK resolves a region when a client is CONSTRUCTED, from the
      # config object or the environment — it does NOT go and ask the instance
      # metadata service which region it is in. `placement/region` appears
      # nowhere in botocore. So a container that calls SSM or Secrets Manager
      # has to be GIVEN one, and the only place it can be given one is here: a
      # Docker container does not inherit the host's environment, so without this
      # line the `api` container reaches `resolve_database_url`, finds
      # DB_DSN_SOURCE asking for the AWS path, and raises before boto3 is ever
      # constructed. That is the resolver behaving correctly; the missing piece
      # was in this file, not in api/app/config.py.
      #
      # Passed through, not composed, for the same reason DATABASE_URL above is:
      # `${AWS_REGION:-}` gives the container exactly what the operator's `.env`
      # holds and NOTHING ELSE. On a host that does not use the AWS credential
      # path — which is every local development machine, where DB_DSN_SOURCE
      # stays at its `environment` default — AWS_REGION is unset and this
      # interpolates to EMPTY, mirroring how DB_DSN_SOURCE defaults to
      # `environment` rather than to a source nobody chose. The local stack
      # never constructs an AWS client, so an empty region is inert there rather
      # than broken.
      #
      # A region is NOT a credential. It names a location, carries no secret
      # material, and grants nothing on its own — access still comes from the
      # instance role, or from whatever credential chain boto3 finds. So this is
      # safe as a plain container environment entry, where `docker inspect` would
      # show it, in a way that the DATABASE_URL line above is safe only because
      # it points at a throwaway local database. Do not let that distinction
      # blur: the reason this line discloses nothing is that there is nothing in
      # it to disclose.
      #
      # AND DO NOT REPLACE THE EMPTY DEFAULT WITH A REAL REGION. This is the one
      # line where a "helpful" hardcode does real damage. A wrong hardcoded region
      # does not fail as a configuration error — it fails as an AWS error naming a
      # region this deployment never used, which reads like an IAM or networking
      # problem and sends the operator to audit the instance role while the actual
      # fault is one word in this file. Silence is the correct default; the
      # operator who knows where their RDS instance lives sets AWS_REGION in
      # /opt/lemondrop/.env alongside the other production values.
      AWS_REGION: "${AWS_REGION:-}"
      # The embedding width, passed through so the container validates against
      # the schema's vector(384) with the real configured value rather than the
      # compiled-in default. `:-384` is a fallback, not a second source of truth:
      # app/config.py rejects any width that disagrees with the migration.
      EMBEDDING_DIM: "${EMBEDDING_DIM:-384}"

    depends_on:
      # NOTE: `postgres` is deliberately NOT in this list. It is profile-gated and
      # does not exist in production, where this block's absence would fail every
      # compose call — see the block above. Start it yourself:
      #     docker compose --profile devdb up -d postgres
      embedder:
        condition: service_healthy
      reranker:
        condition: service_healthy

    # Same restart policy as the workers, for the same reason: come back after a
    # host reboot, but respect an explicit `stop`.
    restart: unless-stopped

    # Memory bound — same rationale as the workers (see reranker block):
    # bound a runaway so it cannot starve the host. The api is a Python
    # application with no model weights, so its resident footprint is far
    # below the workers'. 512 MiB is generous headroom for a healthy
    # worker while keeping the combined worst-case (reranker 1024m +
    # embedder 512m + api 512m = 2 GiB) at the t3.small host size, leaving
    # headroom for the OS and Docker at expected usage (~850 MiB combined).
    # The real fix was capacity (t3.small); this is a safety net.
    mem_limit: "512m"

    # Our own healthcheck, and it MUST use the variable. The llama.cpp image
    # ships a probe hardcoded to 8080 (which is why both workers are pinned to
    # 8080), but this image ships no probe at all, so there is nothing inherited
    # to stay in sync with — the probe written here is the only one, and it has
    # to be correct on its own. Hence ${API_INTERNAL_PORT} rather than a literal.
    #
    # The probe is the interpreter already in the image (python:3.12-slim ships
    # no curl), so no package is added to the image purely to be able to health
    # check it. urlopen raises on any non-2xx, so an exception is a non-zero
    # exit and a 503 from our own endpoint — which is exactly what "a dependency
    # is down" looks like — correctly reads as unhealthy here.
    #
    # The in-call timeout (4s) is deliberately below the healthcheck timeout (5s):
    # it lets the probe fail and exit on its own terms instead of being killed
    # mid-flight by the scheduler.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:${API_INTERNAL_PORT}/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Short, unlike the workers' 120s. The API has no model to load: it is
      # serving Python the moment the process starts, and its dependencies are
      # already guaranteed loaded by depends_on above.
      start_period: 30s

    # Same log bounding as the workers, same reason: a long-lived service must
    # not grow its on-disk logs without limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── postgres (DEVELOPMENT ONLY — profile: devdb) ────────────────────────────
  # Milestone 3 needs real persistence: documents with 384-dim vectors, queried
  # by pgvector's exact `<=>` operator. So we need PostgreSQL 16 with the
  # vector extension, locally.
  #
  # ── WHY `profiles: [devdb]` IS NOT OPTIONAL ──────────────────────────────────
  # scripts/boot.sh:267 runs a bare `docker compose up -d --remove-orphans` on
  # the EC2 PRODUCTION host. Compose only starts services that either have no
  # profile or whose profile was explicitly enabled. A profile-gated service is
  # therefore invisible to that command: it is not started, not created, and
  # nothing on EC2 knows this block exists. Without the profile, production would
  # boot a second database nobody asked for, and on a db.t3.micro-adjacent host
  # it would quietly eat memory the inference workers need.
  # Start it explicitly, always with the profile named:
  #     docker compose --profile devdb up -d postgres
  # or `docker compose --profile devdb up -d` to run it alongside everything.
  #
  # ── WHY THE VARIABLES BELOW ARE `${VAR}` AND NOT `${VAR:?message}` ───────────
  # Compose interpolates the WHOLE file before it decides what to start — profile
  # membership is not an interpolation guard. So `${DEV_DB_PASSWORD:?...}` would
  # abort EVERY `docker compose` call in this directory, including the
  # profile-less production boot on EC2, whenever that variable is unset. That is
  # a hard error on the exact command the EC2 boot depends on, caused by a
  # database that EC2 is not even running. Plain `${VAR}` it is: the production
  # path is unaffected by variables it has no use for, and if someone DOES start
  # this profile without setting a password, the postgres image refuses to
  # initialise on its own — which is the loud failure we actually want, from the
  # component that owns the rule.
  #
  # ── WHY THE PASSWORD IS NOT IN THIS FILE ────────────────────────────────────
  # A credential written here is a credential in git: this file is tracked, so
  # an inline POSTGRES_PASSWORD would live in history permanently, and the exact
  # same mistake in production would be an RDS master password on the public
  # internet. The dev password therefore lives in .env (gitignored) as
  # DEV_DB_PASSWORD. The cost is one extra file to remember; the benefit is that
  # "this repo contains no database credentials" stays a checkable property
  # rather than a promise. See .env.example.
  postgres:
    image: pgvector/pgvector:pg16

    # The gate. This single line is what keeps the production boot untouched;
    # everything else in this block is detail. See above for why.
    profiles:
      - devdb

    # PostgreSQL 16 to match `var.db_engine_version = "16"` on the RDS instance.
    # Matching the major version locally is deliberate: pgvector behaviour,
    # planner choices and index semantics are version-sensitive, so a local
    # PostgreSQL 15 would let a migration pass here and fail against
    # production. This is a dev-only container; production is RDS, not this.
    #
    # No `build:` — pgvector/pgvector is a published third-party artifact, same
    # category as llama.cpp:server, and is consumed as published rather than
    # rebuilt.

    # ── WHY LOOPBACK AND NOT 0.0.0.0 ──────────────────────────────────────────
    # Publishing to 0.0.0.0 binds every interface the host has, including the
    # public one. On EC2 that is an internet-facing PostgreSQL with a
    # guessable user, a weak password and no TLS — a remote compromise, not a
    # debugging convenience. Binding 127.0.0.1 makes the port reachable from this
    # machine and from nothing else, which is the entire requirement here:
    # `psql` on the workstation needs a socket, and no other client does.
    # This is also why the "one published door" rule above still holds — the
    # API's door is the only one reachable from off-host.
    ports:
      - "127.0.0.1:${DEV_DB_HOST_PORT:-5432}:5432"

    environment:
      # The three POSTGRES_* names are the image's own contract, not ours: the
      # official entrypoint creates this user and this database on first boot
      # of an empty volume, which is what makes the named volume below
      # self-provisioning on a fresh machine.
      POSTGRES_USER: "${DEV_DB_USER}"
      POSTGRES_PASSWORD: "${DEV_DB_PASSWORD}"
      POSTGRES_DB: "${DEV_DB_NAME}"
      # Scrypt password hashing (PostgreSQL 10+). Not security theatre: it is
      # what stops a leaked pgdata directory from yielding plaintext passwords,
      # and it is the default, so stating it makes the guarantee deliberate
      # rather than accidental.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    # A NAMED VOLUME, not a bind mount and not an anonymous volume. It has to
    # outlive `docker compose down`: migrations run, you take the stack down,
    # you bring it back up, and the schema and your documents must still be
    # there. A named volume is also not a git object and not something that
    # `rm -rf` in the project directory destroys.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # pg_isready is the image's own liveness tool: it does a real connection
    # check against the named user and database, so it fails not merely because
    # the process is up but because the database is actually accepting queries.
    # It exits 0 on "accepting connections", non-zero while initdb is still
    # running. This is the probe a future
    # `depends_on: {postgres: {condition: service_healthy}}` will use — written
    # now so the wiring is a one-line addition in a later commit rather than a
    # design change.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      # initdb on a cold, empty volume takes a while; a probe that times out
      # during it would restart the container mid-initialisation, which is the
      # failure mode start_period exists to prevent.
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    # Identical log bounding to every other service, for the identical reason.
    # A database is a long-lived process and json-file logs grow without limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── Named volumes ───────────────────────────────────────────────────────────
# Declared at the top level so `pgdata` is a real project-scoped volume rather
# than an anonymous one compose invents a random name for. Declaring it is also
# what makes `docker compose down -v` able to delete it deliberately, instead of
# it leaking on every machine that ever ran the devdb profile.
volumes:
  pgdata:
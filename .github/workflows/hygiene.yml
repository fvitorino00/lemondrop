name: hygiene

# Milestone 4, Stage 1 — the state-leak gate.
#
# This is the ONLY Stage 1 gate. It exists because .gitignore is not a security
# boundary: it shapes what `git add` does by default, and `git add -f` overrides
# it silently, with no warning and no diff to review. A state file, a `.env`, a
# Terraform crash log or a model weight can therefore be tracked while every
# .gitignore rule still "looks correct". The only reliable statement of what is
# tracked is `git ls-files` — the index itself — so both checks below read that
# and nothing else.
#
# This gate deliberately asserts decisions .gitignore already makes. That is not
# duplication: .gitignore expresses intent to a human, this gate enforces it
# against `git add -f`. Neither can replace the other.
#
# Two failure modes, two steps, independently removable:
#   1. forbidden-paths-tracked      — a forbidden artifact is IN THE INDEX
#   2. secrets-in-tracked-content   — a credential is INSIDE an innocuous file
# Step 1 catches the wrong path. Step 2 catches the innocuous path. A `.md` full
# of AWS IAM prose passes step 1 and can still fail step 2.

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS — and why `push: branches: [main]` is GONE
# ─────────────────────────────────────────────────────────────────────────────
# This workflow is a REUSABLE WORKFLOW (`workflow_call`) as well as a directly
# triggered one. It runs, unchanged and in full, in two situations:
#
#   1. ON A PULL REQUEST — `pull_request:`, exactly as it always has. The gates
#      in this file are what review depends on, and they must keep running on
#      every PR with no change to their behaviour whatsoever.
#   2. ON A PUSH TO `main` — but INDIRECTLY. `.github/workflows/release.yml`
#      triggers on `push` to `main` and calls THIS file with `uses:`. The gates
#      run, in the same run, as `state-leak-gate` and `terraform-validate`.
#
# WHY THE DIRECT `push: branches: [main]` TRIGGER WAS REMOVED
# Keeping both triggers is not "belt and braces", it is a duplicated run. With
# `push: main` still declared here, every merge to main produced:
#     (a) a full `hygiene` run triggered directly by the push, AND
#     (b) a full `release` run whose `hygiene` job calls this file again.
# Two terraform validations, two state-leak scans, two sets of logs to read, and
# — far worse — two independent verdicts about the SAME revision. When they
# disagree (a flaky provider download, a cancelled run) there is no principled
# way to say which one gated the published image, and the answer would be
# "whichever one finished last", which is not a rule.
# Removing the push trigger makes the run count EXACTLY ONE per event. The
# gates did not become optional on `main`; they became part of the release
# pipeline, where `needs:` makes them blocking rather than advisory.
#
# `workflow_dispatch:` is kept: a human must be able to run these gates by hand,
# and release.yml's manual trigger cannot be the only way to re-check `main`.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Minimal by construction. This workflow reads the repository and nothing else.
# `packages: write` and `id-token: write` belong to the image-build/publish
# stages and are NOT requested here — granting a permission no step uses is
# gratuitous privilege, and OIDC-to-AWS in particular is a credential-exchange
# permission that must never ride along on a hygiene check.
permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  state-leak-gate:
    name: state-leak gate
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      # ── Check 1 ─────────────────────────────────────────────────────────────
      - name: forbidden-paths-tracked
        run: |
          set -euo pipefail

          # Ground truth is the INDEX. Not the working tree — this repo has a
          # real 304 MB .gguf and a real .env sitting on disk right now, both
          # correctly ignored and untracked, and this gate must stay silent
          # about both. Not .gitignore — see the header.
          TRACKED="$(git ls-files)"

          # Matched against the FINAL PATH COMPONENT ONLY, so `infra/terraform.tfstate`
          # is caught exactly as `./terraform.tfstate` would be, at any depth.
          #
          # This is not a stylistic detail, it is a correctness one, and getting it
          # wrong is invisible: the pattern below is anchored `^...$` and contains
          # `[^/]+`, so running it against a full path like `infra/terraform.tfstate`
          # simply does not match. An earlier draft of this gate did exactly that and
          # MISSED both nested state files in its own failure test while still exiting
          # 1 for other reasons. A gate that half-works is worse than no gate, so the
          # basename is extracted explicitly below rather than trusted to the regex.
          #
          # `.env` is anchored EXACTLY and that is deliberate: `.env.example` is
          # a committed, credential-free template and must keep passing. Matching
          # `.env*` here would break the repository on day one.
          FORBIDDEN_BASENAME='^(\.env|[^/]+\.tfstate|[^/]+\.tfstate\..+|crash\.log|crash\..+\.log|[^/]+\.gguf)$'

          # `models/*` is ignored wholesale with a single re-include, so exactly
          # one path may ever be tracked beneath it.
          MODEL_KEEP='models/.gitkeep'

          index="$(mktemp)"
          printf '%s\n' "$TRACKED" > "$index"
          echo "Tracked files in index: $(wc -l < "$index" | tr -d ' ')"

          # Test each path's BASENAME against the pattern, but report the FULL path,
          # so a nested `infra/terraform.tfstate` fails with a path a human can act
          # on rather than with a bare `terraform.tfstate`.
          forbidden="$(
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              base="${path##*/}"          # no-slash paths yield themselves
              if printf '%s\n' "$base" | grep -qE "$FORBIDDEN_BASENAME"; then
                printf '%s\n' "$path"
              fi
            done < "$index"
          )"

          # `models/` is matched as a full-path PREFIX (not a basename) and the one
          # permitted file is excluded as an exact whole line, so nested model
          # artifacts such as `models/extra/x.bin` are caught too.
          models="$(grep -E '^models/' "$index" | grep -v -F -x "$MODEL_KEEP" || true)"

          failed=0

          # `<<<` rather than a pipe: a piped `while` runs in a subshell and the
          # `failed=1` would be discarded the moment the loop ended.
          if [ -n "$forbidden" ]; then
            failed=1
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "::error file=${path},title=forbidden path is tracked::$(basename "$path") is tracked in git. Remove it from the index (git rm --cached \"$path\") and commit that removal. If a past commit already carried it, the credential is in history and must be rotated, not just deleted."
            done <<< "$forbidden"
          fi

          if [ -n "$models" ]; then
            failed=1
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "::error file=${path},title=model weight is tracked::Only ${MODEL_KEEP} may be tracked under models/. Untrack $path — model weights are build artifacts, not source."
            done <<< "$models"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error title=forbidden-paths-tracked::FAILED — the index contains artifacts that must never be tracked. Every path above is listed explicitly."
            exit 1
          fi

          echo "forbidden-paths-tracked: PASS — no state, env, crash log or model weight is tracked."

      # ── Check 2 ─────────────────────────────────────────────────────────────
      - name: secrets-in-tracked-content
        run: |
          set -euo pipefail

          # ── WHAT IS ACTUALLY SCANNED ─────────────────────────────────────────
          # The scan set is NOT an extension list. It is every TRACKED file minus
          # every file git classifies as BINARY. The command below is
          #     git grep -nIE <pattern> -- .
          # and each flag means something specific:
          #
          #   no rev   → tracked files only. Untracked and .gitignored files are
          #              invisible, so the real .env and the real 304 MB .gguf
          #              sitting on disk cannot trip this step.
          #   -- .     → a pathspec for the CURRENT DIRECTORY, recursively. This
          #              step runs at the workspace root, so `.` is the whole tree.
          #              It filters nothing by extension. A genuinely
          #              extension-narrowed scan would read `-- '*.md' '*.tf'
          #              '*.yml'`; this is not that, and it is not a subset of it.
          #   -I       → SKIP files git classifies as binary: a NUL byte in the
          #              first ~8000 bytes, or `binary` set in .gitattributes.
          #
          # `-I` is the ONLY thing narrowing coverage, and it is a real,
          # acknowledged gap. Verified empirically: a credential planted in a
          # tracked .bin/.gguf/.png is reported by plain `git grep -nE` as
          # "Binary file X matches" with exit 0, but is SILENTLY SKIPPED under
          # `-I` with exit 1. Do not read "no matches" here as "binaries are
          # clean". Accepted rather than fixed: tracked binaries are Step 1's
          # job, and removing `-I` would make this step print binary matches the
          # redaction path cannot parse.
          #
          # So in practice `.py`, `.sh`, `.ps1`, `.json`, `.toml`, `.md`, `.tf`,
          # `.yml` and extensionless files are ALL scanned. Coverage comes from
          # "tracked and non-binary" — never from a file-extension allowlist.
          #
          # ── WHAT THIS IS NOT ─────────────────────────────────────────────────
          # The five patterns below are a NARROW BACKSTOP, not comprehensive
          # secret detection. They are five hand-written regexes. They miss
          # unlisted providers, unlisted key formats, high-entropy tokens, base64
          # blobs, connection strings, secrets split across lines, and anything
          # not already in the index. A PASS here means only "these five shapes
          # are absent from tracked non-binary files" — not "the repo is clean".
          #
          # This repository is PUBLIC. The authoritative detector for it is
          # GitHub's built-in secret scanning and push-protection alerts, which
          # run on the platform over the full push history regardless of what
          # this workflow matches. This step is a cheap early local signal, not
          # the detector of record. Do not weaken it — but do not treat it as one.
          #
          # ── ON FALSE POSITIVES ───────────────────────────────────────────────
          # This repo discusses AWS IAM, Secrets Manager and
          # least privilege extensively, in prose and in Terraform comments, so
          # this check was expected to need an allowlist. It does not: every
          # pattern below is anchored and quantified, and `git grep` over the
          # tracked set currently returns zero matches. So there is NO allowlist
          # and NO directory exclusion here — a whole-directory whitelist is the
          # single fastest way to make a secret gate blind, and there is nothing
          # to excuse.
          #
          # The one near-miss worth recording: docs/verification-milestone-3.md
          # quotes the regex `ASIA[0-9A-Z]+` verbatim in a table of grep
          # commands. That is a character class, not sixteen key characters, so
          # it does not match `ASIA[0-9A-Z]{16}`. The quantifier is what keeps
          # the prose safe.
          #
          # If this gate ever fires on a line a human can see is documentation,
          # the fix is to adjudicate that printed line — narrow the pattern, or
          # rephrase the sentence. It is NOT to widen an exclusion list.
          read -r -d '' SPECS <<'SPECS_EOF' || true
          aws_access_key_id|AKIA[0-9A-Z]{16}
          aws_temp_access_key_id|ASIA[0-9A-Z]{16}
          github_pat_classic|ghp_[A-Za-z0-9]{36}
          github_pat_fine_grained|github_pat_[A-Za-z0-9_]{20,}
          pem_private_key|BEGIN [A-Z ]*PRIVATE KEY
          SPECS_EOF

          printf '%s\n' "$SPECS" | python3 -c '
          import re, subprocess, sys

          # `git grep` without a rev searches tracked files only — untracked and
          # ignored files are invisible to it, which is exactly the property
          # this check needs.
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          print(f"Tracked files in index: {len(tracked)}")

          failures = 0
          for spec in sys.stdin.read().splitlines():
              spec = spec.strip()
              if not spec:
                  continue
              name, pattern = spec.split("|", 1)
              rx = re.compile(pattern)
              proc = subprocess.run(
                  ["git", "grep", "-nIE", pattern, "--", "."],
                  capture_output=True, text=True,
              )
              if proc.returncode not in (0, 1):
                  # Distinguish "no matches" (1) from "git grep broke" (>1).
                  print(f"::error title=secret scan error::git grep failed for {name}: {proc.stderr.strip()}")
                  failures += 1
                  continue
              if proc.returncode == 0:
                  for line in proc.stdout.splitlines():
                      path, lineno, text = line.split(":", 2)
                      # Redact the credential span but keep the surrounding line
                      # visible. A human adjudicating a false positive needs to
                      # see that this is a doc sentence about IAM — not the key
                      # itself. Printing the raw match would copy a live secret
                      # into CI logs, which is a second leak, not a report.
                      shown = rx.sub(
                          lambda m, n=name: f"<REDACTED:{n}:{len(m.group(0))}chars>",
                          text,
                      )
                      print(
                          f"::error file={path},line={lineno},"
                          f"title=credential pattern {name} in tracked content::"
                          f"{shown.strip()}"
                      )
                      failures += 1

          if failures:
              print(
                  "::error title=secrets-in-tracked-content::FAILED — "
                  f"{failures} credential pattern(s) matched in tracked content. "
                  "Each is listed above with its file, line and a redacted "
                  "rendering of the line."
              )
              sys.exit(1)
          print("secrets-in-tracked-content: PASS — no credential pattern in any tracked non-binary file. Binary files are skipped by -I and are NOT covered here.")
          '
# ═══════════════════════════════════════════════════════════════════════════
  # Milestone 4, Stage 2 — terraform validation for both stacks
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # WHAT IT DOES, AND WHAT IT DELIBERATELY NEVER DOES
  # It formats-checks, initialises and validates `infra/` and `infra/bootstrap/`.
  # It NEVER contacts AWS. No credentials, no `plan`, no `apply`, no state read,
  # no state write, no state lock. The workflow-level `permissions: contents:
  # read` is the entire permission set and no step requests a secret, so this
  # job holds nothing with which it could authenticate to AWS even in principle.
  #
  # THE THREE THINGS THAT MAKE "NO AWS" TRUE RATHER THAN MERELY INTENDED
  # ──────────────────────────────────────────────────────────────
  # 1. `-backend=false` on the main stack. `infra/versions.tf` declares a real
  #    s3 backend pointing at the live bucket `lemondrop-tfstate-filipe` with
  #    `use_lockfile = true`. A plain `init` there opens that bucket and takes a
  #    real `.tflock` against real state. `-backend=false` skips backend
  #    initialisation entirely, so the bucket is never contacted at all.
  # 2. `-input=false` on both stacks. A CI terminal has nobody to answer a
  #    prompt, so init fails fast and loudly instead of hanging until the job
  #    is killed at the six-hour mark with no explanation in the log.
  # 3. `-lockfile=readonly` on both stacks. Provider resolution may only READ
  #    the committed `.terraform.lock.hcl`. If it were incomplete or disagreed
  #    with the declared constraints, init FAILS rather than quietly rewriting it
  #    and then validating a different provider than the one that is committed.
  #
  # bootstrap is the deliberate exception to (1). `infra/bootstrap/terraform.tf`
  # has NO backend block — it is the stack that CREATES the state bucket, so it
  # cannot be the stack that uses it — which means its backend is the local one.
  # `-backend=false` there would be a flag with nothing to skip. The flags are
  # read out of what each file actually declares, not applied uniformly.
  #
  # WHY `-lockfile=readonly` IS NOT ENOUGH ON ITS OWN
  # It prevents a write attempt, but "no write attempted" is not the same claim
  # as "nothing changed". The `lockfile-drift` steps close that gap:
  # `git diff --exit-code` against the committed blob is what actually PROVES
  # the provider selection did not move, independent of whether Terraform tried
  # to move it. A pinned provider cannot silently drift.
  #
  # WHY THE TERRAFORM VERSION IS PINNED HERE
  # Both `fmt` output and `validate` acceptance are version-sensitive, so a
  # runner-default Terraform could disagree with a developer's local run for
  # reasons having nothing to do with the configuration. Both stacks declare
  # `required_version = ">= 1.10"` — a floor, not a choice — so this job pins
  # the exact version the configuration was verified against. The pin does NOT
  # raise the floor the repository declares; it satisfies it.

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      # An explicit version, never the runner default. See "WHY THE TERRAFORM
      # VERSION IS PINNED HERE" above.
      #
      # `setup-terraform@v3` declares exactly four inputs: `terraform_version`,
      # `terraform_wrapper`, `cli_config_credentials_hostname` and
      # `cli_config_credentials_token`. There is NO `plugin_cache` input at v3 or
      # at v4, so the provider cache this job uses is NOT requested from this
      # action — it is configured explicitly in the next step. An earlier revision
      # of this comment claimed no `TF_PLUGIN_CACHE_DIR` was set by this job at
      # all; that was true when written and is false now, and it is corrected
      # here rather than left to contradict the step below it.
      - name: setup-terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      # ── IN-JOB SHARED PROVIDER CACHE ───────────────────────────────────────
      # WHAT THIS IS, AND WHY IT EXISTS
      # `infra/` and `infra/bootstrap/` are two separate working directories that
      # lock the SAME provider — hashicorp/aws v5.100.0, 706,945,176 bytes
      # unpacked — and this job runs `terraform init` in BOTH of them, one after
      # the other. Terraform installs providers per working directory, so without
      # this step the job downloads and unpacks that same ~675 MB binary TWICE
      # inside a single run.
      #
      # `TF_PLUGIN_CACHE_DIR` is Terraform's own mechanism for that: it names a
      # directory that the first init populates and that a later init in a
      # DIFFERENT working directory installs from instead of downloading.
      # Measured on this machine, these two stacks, these exact flags:
      #     init — main       `- Installing hashicorp/aws v5.100.0...`  33.2 s
      #     init — bootstrap  `- Using hashicorp/aws v5.100.0 from the
      #                          shared cache directory`                2.2 s
      # A control run with the variable unset took 33.2 s and printed
      # `Installing`, so the 2.2 s figure is the cache and not a warm DNS cache
      # or a lucky network moment.
      #
      # WHY `$GITHUB_ENV` AND NOT A PLAIN `export`
      # Every `run:` block is a separate shell process. An `export` inside this
      # step dies with this shell, the two init steps below would never see the
      # variable, and the job would download twice while looking unchanged and
      # for no visible reason. `$GITHUB_ENV` is the mechanism that carries an
      # environment variable forward to later steps of the SAME job — which is
      # exactly the scope this cache is meant to have.
      #
      # WHY `$RUNNER_TEMP` AND NOT SOMETHING INSIDE THE TREE
      # Two traps, both avoided:
      #   1. Nested inside `.terraform/`. `.terraform/` is a directory Terraform
      #      owns and rewrites, so a cache inside it collapses the distinction
      #      between "the shared copy" and "this working directory's installed
      #      copy", and it hides inside a gitignored tree where nothing can see
      #      it. It also gives up the one property this step needs, which is
      #      surviving independently of any working directory.
      #   2. Nested inside the checked-out repository. Then a ~675 MB untracked
      #      directory appears in the working tree, and the `git status` and
      #      `git diff --exit-code` steps below have to reason around it.
      # `$RUNNER_TEMP` is runner scratch space, outside the checkout, discarded
      # when the job ends — which is precisely the lifetime this cache wants.
      #
      # THE CAVEAT THAT ACTUALLY BITES: THE DIRECTORY MUST EXIST BEFORE init
      # Verified against 1.16.5: pointing `TF_PLUGIN_CACHE_DIR` at a path that
      # does not exist makes init report a CLI configuration error before it
      # installs anything —
      #     Error: The specified plugin cache dir <path> cannot be opened:
      #     stat <path>: no such file or directory
      #     As a result of the above problems, Terraform may not behave as
      #     intended.
      # init then creates the directory anyway and carries on. So the failure is
      # not a clean one at the point of the mistake: whether the JOB goes red can
      # come down to some unrelated later step, and the log then reads like a
      # lockfile or provider problem when the real cause was a setup line above
      # it. The `mkdir -p` below is load-bearing, not tidiness — it is the
      # difference between a clean log and one that opens on a warning the reader
      # has to know to recognise.
      #
      # WHY THIS CANNOT WEAKEN THE LOCKFILE GUARANTEE
      # Worth being precise, because a shared cache directory looks like it could
      # let provider selection drift. It cannot. The cache is a STORE keyed by
      # provider address and version; init still decides which version to install
      # exclusively from the committed `.terraform.lock.hcl`, under
      # `-lockfile=readonly`, and a cache holding some other version simply goes
      # unused. The guarantee that matters was never "init behaved" — it is the
      # two `git diff --exit-code` steps, which compare the lockfile against the
      # committed blob regardless of how the bytes arrived. This cache changes
      # only WHERE the bytes come from, never WHICH version is selected.
      #
      # WHAT THIS DELIBERATELY DOES NOT DO: NO CROSS-RUN CACHING
      # This is IN-JOB ONLY. There is no `actions/cache` here, and that is a
      # decision rather than an omission. `$RUNNER_TEMP` does not outlive the job,
      # so every CI run still pays ONE full ~675 MB download exactly as it did
      # before this step existed. What this buys is halving that cost within a
      # run that otherwise pays it twice.
      #
      # Cross-run caching is the obvious next step and is deliberately deferred
      # until this job's real CI wall-clock has been measured. A cache key and a
      # restore path are a behavioural change, not a documentation fix: a stale
      # or poisoned cache is a new way for the job to fail, and one that is hard
      # to read from a log. Adding that failure mode before there is a
      # measurement to justify it would be guessing.
      - name: configure provider cache (in-job)
        run: |
          set -euo pipefail
          CACHE_DIR="${RUNNER_TEMP}/terraform-plugin-cache"
          mkdir -p "$CACHE_DIR"
          echo "TF_PLUGIN_CACHE_DIR=${CACHE_DIR}" >> "$GITHUB_ENV"
          echo "TF_PLUGIN_CACHE_DIR=${CACHE_DIR}"

      # `fmt -check`, never bare `fmt`: it reports and exits non-zero, and it
      # never rewrites a file. Nothing in CI is permitted to edit the tree.
      #
      # These two steps overlap by construction — `terraform fmt -check
      # -recursive` run in `infra/` already descends into `infra/bootstrap/` —
      # and are kept separate anyway so the log names the stack that failed
      # instead of leaving that to be inferred from a relative path.
      - name: fmt — main stack
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: fmt — bootstrap stack
        working-directory: infra/bootstrap
        run: terraform fmt -check -recursive

      # ── Main stack ─────────────────────────────────────────────────────────
      # `-backend=false` is the load-bearing flag on this line.
      - name: init — main stack (no backend)
        working-directory: infra
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: lockfile-drift — main stack
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- infra/.terraform.lock.hcl; then
            echo "::error file=infra/.terraform.lock.hcl,title=terraform lockfile drift::terraform init changed the committed lockfile. The provider set that was validated is not the provider set that is committed. Fix the lockfile deliberately, and commit it in the same change as whatever altered the provider constraints."
            exit 1
          fi
          echo "lockfile-drift (infra): PASS — provider selection is unchanged."

      - name: validate — main stack
        working-directory: infra
        run: terraform validate

      # ── Bootstrap stack ────────────────────────────────────────────────────
      # No `-backend=false` here, and that is a decision read out of
      # `infra/bootstrap/terraform.tf` rather than an oversight.
      - name: init — bootstrap stack (local state)
        working-directory: infra/bootstrap
        run: terraform init -input=false -lockfile=readonly

      - name: lockfile-drift — bootstrap stack
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- infra/bootstrap/.terraform.lock.hcl; then
            echo "::error file=infra/bootstrap/.terraform.lock.hcl,title=terraform lockfile drift::terraform init changed the committed lockfile. The provider set that was validated is not the provider set that is committed. Fix the lockfile deliberately, and commit it in the same change as whatever altered the provider constraints."
            exit 1
          fi
          echo "lockfile-drift (infra/bootstrap): PASS — provider selection is unchanged."

      - name: validate — bootstrap stack
        working-directory: infra/bootstrap
        run: terraform validate

# ═══════════════════════════════════════════════════════════════════════════
  # Milestone 4, Stage 3 — the workflow-compile gate
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # WHY THIS JOB EXISTS AT ALL
  # Run 38603050168 failed in 0 seconds with ZERO jobs. Not one check ran. The
  # workflow did not fail a gate — it failed to COMPILE. The cause was a literal,
  # empty dollar-brace expression sitting inside a comment inside a `run:` block,
  # and GitHub resolves expressions before any job is scheduled, so the comment
  # was not a comment as far as the expression parser was concerned.
  #
  # THAT IS THE POINT, AND IT IS THE WORST PART OF IT
  # A malformed workflow does not fail CI here — it cannot. The compile error is
  # raised before the run exists, so the state-leak gate, the terraform gate and
  # every other gate in this file are not defeated, they are simply never
  # reached. Each one reports success by absence. A gate defined as "the thing
  # that goes red when the gate is broken" cannot catch this, because the class
  # of defect is upstream of every gate: no job in any workflow can observe a
  # workflow that failed to compile. The only thing that can observe it is a
  # checker that reads the file WITHOUT running it — which is what this is.
  #
  # THIS IS A RELEASE GATE BY BEING CALLED, NOT BY BEING WIRED
  # `release.yml` already calls this file with `uses:`, so adding a job here
  # makes it a SIXTH release gate on `main` with no edit to `release.yml` and
  # none required. Anything that fails here fails the release.
  #
  # Note the asymmetry that makes this job load-bearing rather than redundant.
  # A bad workflow can land on `main` DIRECTLY, without ever passing through the
  # pull request that review would have caught it in — and a gate that only ran
  # on `pull_request` would therefore be bypassed by definition in precisely the
  # scenario that motivates it. Running from `main`'s own pipeline is the point.
  #
  # WHAT IT CHECKS: EVERY WORKFLOW, NOT JUST THIS ONE
  # No path argument is passed, so actionlint walks `.github/workflows`
  # recursively and reads every `.yml` and `.yaml` beneath it. Checking only the
  # file this job lives in would be the wrong instinct: the compile failure that
  # motivated this job was not confined to the file being edited, and a
  # malformed `release.yml` zeroes a run just as completely as a malformed
  # `hygiene.yml` does. The three workflows are one blast radius.
  #
  # WHY THE VERSION IS PINNED EXACTLY
  # `1.7.12`, never `latest` — the same reason this file pins `actions/checkout`
  # at a major and terraform at `1.16.5`. A floating tag means the verdict
  # recorded against `main` can change with no commit to account for it.
  #
  # The tag was READ, not guessed. At the time of writing, 1.7.12 is the highest
  # semver tag published for `rhysd/actionlint` on Docker Hub, and `latest`
  # resolves to exactly it, so the pin costs no currency:
  #     rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  # The digest is RECORDED here rather than enforced. Enforcing it would fail
  # the moment the tag is rebuilt for a base-image bump, and this repository
  # does not claim digest-pinning guarantees anywhere else; a stronger claim in
  # one job would be a claim nothing else keeps.
  #
  # WHY THIS JOB NEEDS NOTHING ELSE
  # No `setup-python`, no `setup-terraform`, no `services:`, no provider cache,
  # no credentials, no backend. actionlint is a static checker: it reads files
  # and exits with a status. It declares no `permissions:` of its own and asks
  # for no `secrets:`, so it runs under the workflow-level `contents: read` and
  # holds nothing with which it could authenticate to anything — AWS included.
  # It cannot contact AWS even in principle, because it never runs Terraform.

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      # `-no-color`: actionlint auto-detects a non-TTY and drops colour anyway,
      # but stating it keeps CI logs free of escape codes on every runner image
      # rather than relying on that detection holding.
      #
      # No path argument: see "WHAT IT CHECKS" above — recursive over the whole
      # workflows directory.
      #
      # `-ignore 'SC2016'` is a scope decision, argued at length immediately below.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -no-color -ignore SC2016

  # ═══════════════════════════════════════════════════════════════════════════
  # Milestone 4 — the dependency-audit gate
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # WHAT IT ASSERTS
  # That no package in the resolved dependency closure of
  # `api/requirements-dev.txt` has a known published vulnerability, as of the
  # moment this job runs. One job. It observes; it never repairs — no pin is
  # bumped, no advisory is suppressed, no file is written.
  #
  # WHY THIS FILE AND NOT `tests.yml` OR A WORKFLOW OF ITS OWN
  # `release.yml` calls this workflow WHOLE with `uses:`, and a reusable-workflow
  # call succeeds only if EVERY job inside it succeeded. `build` already declares
  # `needs: [hygiene, tests]`, and `publish` declares `needs: [build]`. So
  # putting the gate here makes it block publication transitively, with ZERO
  # change to the `needs:` graph in `release.yml` and none required. A separate
  # workflow would need a new `uses:` line, a new `needs:` entry and a new
  # position in the gate table; this needs the one-line display-name correction
  # recorded in `release.yml`.
  #
  # WHY ONE JOB AND ONE FILE RATHER THAN TWO JOBS OVER BOTH REQUIREMENTS FILES
  # `api/requirements-dev.txt` line 27 is `-r requirements.txt`, so it pulls in
  # every runtime package transitively. Auditing it therefore STRICTLY DOMINATES
  # auditing `api/requirements.txt` as well: it is a superset of the requirement
  # set, so every finding the runtime-only audit would produce is also produced
  # here. Two jobs would buy zero extra coverage and pay full resolution cost
  # twice.
  #
  # THAT IS A COVERAGE ARGUMENT, NOT AN IDENTITY ARGUMENT, AND THE DIFFERENCE
  # MATTERS. The runtime closure is a strict subset of the dev closure — measured
  # on 2026-10-14, the runtime closure is 34 packages and the dev closure is 43,
  # and the set difference in the runtime direction is empty — BUT THE TWO ARE
  # RESOLVED AT DIFFERENT TIMES. pip-audit resolves each file independently, and
  # an unpinned transitive is re-resolved against whatever the index holds at
  # that moment. So the two audits are not guaranteed to agree package-for-
  # package, and neither is a superset of the other in general: the runtime
  # closure can pick up a version the dev closure did not, and vice versa. The
  # one-file choice trades that second opinion away on purpose, because it buys
  # nothing: a finding in the runtime closure is a finding in the dev closure,
  # and the converse is what is being given up.
  #
  # ── THE OPERATIONAL PROPERTY THAT WILL SURPRISE THE FIRST READER ───────────
  # THIS GATE CAN GO RED WITH NO COMMIT HAVING TOUCHED A REQUIREMENTS FILE.
  #
  # `api/requirements.txt` pins SEVEN direct dependencies with `==`. Its
  # resolved closure is 34 packages. That leaves TWENTY-SEVEN of the thirty-four
  # — everything except those seven direct pins — as TRANSITIVE PACKAGES THAT
  # NO FILE IN THIS REPOSITORY PINS, and pip re-resolves them on every run against
  # whatever PyPI currently serves. Concretely, from the resolution measured on
  # 2026-10-14:
  #
  #     boto3==1.43.112   ← pinned, in api/requirements.txt
  #     botocore 1.43.114 ← NOT pinned by anything; boto3's own ceiling only
  #     urllib3  2.8.0    ← pinned by nobody anywhere in this repository
  #
  # `boto3` is an exact pin and its resolved `botocore` is not, because boto3
  # declares a range for botocore and nothing here narrows it. So an advisory
  # published against, say, `urllib3` can turn this gate red on a run whose diff
  # touches nothing but a comment. THAT IS NOT A FLAKY GATE. It is the gate
  # reporting a real change in what the application would actually install.
  #
  # Read the first red of this kind as an UPSTREAM EVENT, not as a defect in the
  # commit that happened to trigger the run. The fix is necessarily a
  # deliberate bump of whichever pin pulls the vulnerable package in — which is
  # also, not coincidentally, exactly what `api/requirements.txt`'s "exact pins,
  # no ranges" rule asks a human to do by hand. Do not reach for a suppression
  # config to make it stop; see below.
  #
  # WHY `--strict`, AND WHAT IT IS NOT
  # `--strict` is defined by pip-audit as "fail the entire audit if dependency
  # collection fails on any dependency", and it is kept because it is free
  # insurance. It is NOT what makes this audit trustworthy, and it must not be
  # described as though it were — that premise was tested and is false. An
  # UNRESOLVABLE requirement (two pins that cannot co-exist) exits 1 under
  # `--strict` and under plain `pip-audit` alike, with pip's own
  # `ResolutionImpossible` on stderr and ZERO BYTES on stdout. So `--strict`
  # buys nothing on that failure class, which is the one a broken requirements
  # file produces. What it does guard is narrower and later: collection failure
  # AFTER a successful resolution. Keep it, and describe it as what it is.

  dependency-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      # ── THE INTERPRETER ─────────────────────────────────────────────────────
      # 3.12, the same value `tests.yml` runs its whole suite on and the same
      # interpreter `api/Dockerfile` ships (`FROM python:3.12-slim`). It is
      # spelled out here rather than referenced so this job cannot drift from
      # the image it is auditing the dependency set of.
      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── WHY pip-audit IS PINNED TO AN EXACT VERSION ─────────────────────────
      # `==2.10.1`, never a range and never `latest`, for the same reason this
      # file pins actionlint at `1.7.12` and terraform at `1.16.5`: a floating
      # tool version means the verdict recorded against `main` can change with
      # no commit to account for it. A dependency gate whose failure depends on
      # when it ran is not a gate.
      #
      # It is installed into the runner's `setup-python` interpreter and goes no
      # further. It is NOT added to `api/requirements-dev.txt` and it is NOT
      # added to the image: pip-audit audits a requirements FILE, it does not
      # need to be a dependency of the application, and adding an audit tool to
      # the runtime closure would widen the very attack surface this job exists
      # to watch.
      - name: install pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      # `--format json` rather than the default table because the next step has
      # to read it. The default `columns` output is for a human at a terminal;
      # what this needs is a machine-readable report it can turn into one
      # `::error::` annotation per finding, so each advisory is greppable in the
      # log and attachable to a pull request — the same treatment the
      # forbidden-paths gate gives at the `::error file=…` loop above.
      #
      # `--progress-spinner off` keeps carriage returns out of the CI log.
      # `--strict` per "WHY `--strict`, AND WHAT IT IS NOT" above.
      #
      # The exit status is CAPTURED, NOT PROPAGATED. `pip-audit` exits 1 both
      # when it finds something and when it cannot resolve the file at all, and
      # those two want very different annotations. Letting `set -e` kill the step
      # would collapse both into one opaque failure, and would also mean the
      # report below never ran. `|| rc=$?` keeps the step green so the next one
      # can read the report and say which of the two happened.
      - name: dependency-audit
        id: audit
        run: |
          set -euo pipefail

          REPORT="${RUNNER_TEMP}/pip-audit-report.json"

          rc=0
          pip-audit --strict --progress-spinner off --format json \
            --requirement api/requirements-dev.txt > "$REPORT" || rc=$?

          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"
          echo "exit-code=${rc}" >> "$GITHUB_OUTPUT"
          echo "pip-audit exited ${rc}. Report at ${REPORT}."

      # ── WHY THE REPORT STEP EXISTS AT ALL ────────────────────────────────────
      # pip-audit's own JSON is the finding, but a JSON blob is not a CI
      # annotation: nothing highlights it, nothing attaches it to a PR, and a
      # reader has to know the schema to read it. This step turns each finding
      # into one `::error::` line, then decides the build's verdict.
      #
      # FIVE OUTCOMES, AND ALL FIVE WERE EXERCISED BEFORE THIS WAS MERGED —
      # this is not defensive padding. Each branch was run against a report file:
      #   findings found       → one annotation each, then exit 1
      #   clean, exit 0        → a PASS line naming the closure size, exit 0
      #   exit 1, empty stdout → annotation saying NOTHING WAS AUDITED, exit 1
      #   exit 1, unparseable  → annotation quoting what was printed, exit 1
      #   exit 1, zero vulns   → annotation naming it a collection failure
      # The third is the one that matters most and is easiest to get wrong. An
      # unresolvable requirements file produces NO JSON at all, so a parser that
      # only ever reads JSON reports zero findings on it. Zero findings from a
      # run that audited nothing is the worst possible failure mode for a
      # security gate, and this step treats it as RED, not as clean.
      #
      # `AUDIT_REPORT` and `AUDIT_EXIT_CODE` arrive through `env:`, never
      # interpolated into the script body — `release.yml` records why, at its
      # `resolve the image reference` step. A `${{ }}` pasted into a shell
      # command is an injection seam, and these values come from an earlier step
      # of this same job rather than from anything a pull request controls, but
      # the rule costs nothing here and is not worth breaking.
      #
      # No allowlist, no `--ignore-vuln`, no config file. There is deliberately
      # NO `pip-audit.conf` and no ignore file in this repository, and this job
      # does not create one. A suppression list shipped alongside the gate that
      # reads it is a rubber stamp from the day it lands: it would have to be
      # edited before anyone had ever seen this gate green, which is exactly
      # when nobody is looking. If a future advisory genuinely needs an
      # exception, that is a DELIBERATE, SEPARATE commit carrying one
      # per-advisory `--ignore-vuln <ID>`, the written reason, and a review
      # date — reviewed on its merits, not pre-authorised here.
      #
      # WHY NO DEPENDABOT, NO RENOVATE, NO `safety`
      # Declined, not overlooked. This repository's stated policy is exact
      # pinning with deliberate upgrades (`api/requirements.txt` lines 2-5), and
      # an automated dependency updater proposes exactly the range-creating
      # churn that rule exists to prevent — it opens pull requests against pins
      # whose whole purpose is not to move without a human deciding they should.
      # One audit that observes, and human judgement that decides, matches the
      # policy the repository already has.
      - name: report dependency-audit findings
        env:
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
        run: |
          set -euo pipefail
          python - "$AUDIT_REPORT" "$AUDIT_EXIT_CODE" <<'PY'
          import json, sys

          report_path, raw_rc = sys.argv[1], sys.argv[2]
          try:
              rc = int(raw_rc)
          except ValueError:
              rc = -1

          def esc(text):
              # GitHub workflow commands: %, CR and LF are the three that break
              # an annotation, and an advisory description contains all three.
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def one_line(text, limit=240):
              flat = " ".join(str(text).split())
              if len(flat) > limit:
                  flat = flat[: limit - 1].rstrip() + "..."
              return flat

          try:
              with open(report_path, encoding="utf-8") as handle:
                  raw = handle.read()
          except OSError as exc:
              print(
                  "::error title=dependency-audit unreadable report::"
                  f"could not read {report_path}: {exc}"
              )
              sys.exit(1)

          report = None
          if raw.strip():
              try:
                  report = json.loads(raw)
              except ValueError as exc:
                  print(
                      "::error title=dependency-audit unparseable report::"
                      f"pip-audit did not emit JSON on stdout ({exc}). "
                      "First 500 bytes: " + one_line(raw, 500)
                  )
                  sys.exit(1)

          if report is None:
              print(
                  "::error title=dependency-audit failed before reporting::"
                  f"pip-audit exited {rc} without emitting a JSON report, so no "
                  "package was audited. An unresolvable requirement fails here "
                  "with empty stdout, and that is a red build, not a clean one. "
                  "Read the step above for pip's own resolution error."
              )
              sys.exit(1)

          if isinstance(report, dict):
              entries = report.get("dependencies", [])
          else:
              entries = report
          if not isinstance(entries, list):
              print(
                  "::error title=dependency-audit unexpected report shape::"
                  f"expected a list of dependencies, got {type(entries).__name__}. "
                  "This is a pip-audit output-format change, not a clean result."
              )
              sys.exit(1)

          findings = 0
          for dep in entries:
              # pip-audit queries both the PyPI advisory service and OSV, so the
              # SAME advisory arrives twice under one id. Dedupe per package, or
              # a single CVE produces two annotations and the finding count in
              # the summary stops matching the number of distinct problems.
              seen = set()
              for vuln in dep.get("vulns") or []:
                  vid = str(vuln.get("id") or "<unknown-id>")
                  if vid in seen:
                      continue
                  seen.add(vid)
                  findings += 1
                  aliases = ", ".join(vuln.get("aliases") or []) or "none reported"
                  fixes = ", ".join(vuln.get("fix_versions") or []) or "no fix published"
                  print(
                      "::error file=api/requirements-dev.txt,"
                      f"title=advisory {vid} affects {dep.get('name')} {dep.get('version')}::"
                      + esc(
                          one_line(
                              f"{vid} (aliases: {aliases}; fixed in: {fixes}). "
                              f"{one_line(vuln.get('description') or '', 200)} "
                              "Resolve it by bumping the pin that pulls this package "
                              "in, and suppress nothing."
                          )
                      )
                  )

          if findings:
              print(
                  "::error title=dependency-audit::FAILED — "
                  f"{findings} advisory match(es) in the resolved dependency "
                  "closure of api/requirements-dev.txt, listed one per line "
                  "above. There is no ignore list: fix the pin, or record a "
                  "deliberate, per-advisory exception."
              )
              sys.exit(1)

          if rc != 0:
              print(
                  "::error title=dependency-audit::FAILED — pip-audit exited "
                  f"{rc} with no advisory match. That is a collection failure "
                  "under --strict, not a clean audit. Read the step above."
              )
              sys.exit(1)

          print(
              "dependency-audit: PASS — no known vulnerabilities in the "
              f"{len(entries)}-package closure resolved from "
              "api/requirements-dev.txt (pip-audit --strict, exit 0)."
          )
          PY

  # ── SCOPE: WHY `-ignore 'SC2016'` AND NOT `-shellcheck=` ────────────────────
  # This is the one judgement call in this job, so it is recorded here rather
  # than settled silently in a flag.
  #
  # WHAT THE DEFAULT SCOPE ACTUALLY REPORTS ON THIS REPOSITORY, TODAY
  # Measured with 1.7.12 against the current workflows, default configuration:
  #     exit status 1, exactly TWO findings, both shellcheck, ZERO expression
  #     errors, zero syntax errors, zero unknown-key errors:
  #       .github/workflows/hygiene.yml:163:9   SC2016, script line 74 col 37
  #       .github/workflows/release.yml:592:9   SC2016, script line 27 col 35
  #
  # RE-MEASURED, NOT ASSUMED, and still exactly TWO after the dependency-audit
  # job landed — which is the point worth recording. Adding a job with a
  # `python - <<'PY'` heredoc did not add a finding, so shellcheck is reading
  # that block rather than skipping it. The `release.yml` line number MOVED when
  # gate 7 was added above it (it was 556, then 581, and is 592 now); the
  # finding itself is unchanged, because it is the same `sed` program. Line
  # numbers in a file that is still being edited are a snapshot, not an
  # invariant — re-measure them rather than trusting this block.
  #
  # BOTH ARE FALSE POSITIVES AND BOTH HAVE THE SAME ROOT CAUSE:
  # A BACKTICK INSIDE A SINGLE-QUOTED STRING.
  #   1. hygiene.yml — a backtick inside a PYTHON COMMENT, inside `python3 -c`.
  #      Located by bisection, not guessed: it is the word `git grep` written
  #      with backticks in that Python comment that fires it, not the `$SPECS`
  #      expansion sitting beside it on the same line.
  #   2. release.yml — markdown backticks inside a `sed` program that wraps each
  #      line in code formatting for a workflow annotation. Single quotes are
  #      the ONLY correct quoting for that sed program.
  # ShellCheck sees a single-quoted string and warns when what follows could be a
  # command substitution. It cannot know it is reading Python or sed.
  #
  # In both cases "expressions do not expand here" is the DESIRED behaviour, not
  # a defect. Acting on these findings would mean corrupting a Python comment or
  # breaking an annotation in order to satisfy a linter reading them as shell.
  # There is no genuine defect to fix here, and none was fixed.
  #
  # WHY THIS IS `-ignore` AND NOT `-shellcheck=`
  # shellcheck is DEFERRED, NOT DISABLED. `-shellcheck=` would switch the entire
  # integration off and discard a check that is demonstrably working: shellcheck
  # 0.11.0 ships inside this image, is genuinely active, and swept every `run:`
  # block in every workflow in this repository without finding one real problem.
  # `-ignore 'SC2016'` leaves it running and removes exactly the one rule that
  # is wrong here. Verified against the exact flags above: a planted SC2086
  # (unquoted expansion) in a scratch file still fails this command line, so the
  # ignore is narrow and shellcheck is demonstrably not muted.
  #
  # SC2016 IS ALSO THE RIGHT RULE TO SUPPRESS, NOT A CONVENIENT ONE
  # Its entire claim is that expressions do NOT expand in single quotes — which
  # is exactly why single quotes are used to hand a literal program or a literal
  # dollar sign to an interpreter. In shell embedded in YAML, where
  # single-quoting is the normal way to pass a multi-line interpreter program,
  # the rule is close to unfalsifiable and close to always wrong. That is a
  # rule-level reason to suppress it, and it is why this is one `-ignore` rather
  # than a scatter of inline disable comments dropped through working code.
  #
  # WHAT IS *NOT* SUPPRESSED
  # The class that motivated this job — expression errors, and with them the
  # syntax errors and unknown keys that share the same compile boundary — is
  # fully in scope and fully enforced. Nothing here narrows the coverage that
  # matters. Verified negatively: a scratch workflow carrying the exact defect
  # from run 38603050168 fails this command line with a non-zero exit.
  #

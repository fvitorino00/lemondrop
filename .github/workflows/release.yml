name: release

# ═════════════════════════════════════════════════════════════════════════════
# Milestone 4, Stage 4 — build, inspect, and publish the API image.
# ═════════════════════════════════════════════════════════════════════════════
#
# WHAT THIS WORKFLOW IS FOR
#   On a merge to `main`, run every verification gate this repository has, and
#   only then build the API image, inspect what was actually built, and publish
#   THAT image to GHCR. The five gates are not advisory and not a parallel
#   concern: publication is downstream of all of them by construction.
#
# ═════════════════════════════════════════════════════════════════════════════
# THE FIVE GATES, AND WHAT "ALL FIVE PASSED" ACTUALLY MEANS HERE
# ═════════════════════════════════════════════════════════════════════════════
# A "gate" in this repository is a JOB. There are exactly five of them, in two
# files, and they are listed here in `needs:` order:
#
#   ┌────┬────────────────────────┬──────────────┬────────────────────────────────┐
#   │ #  │ JOB                    │ IN FILE      │ WHAT IT ASSERTS               │
#   ├────┼────────────────────────┼──────────────┼────────────────────────────────┤
#   │ 1  │ state-leak-gate        │ hygiene.yml  │ BOTH forbidden-path steps: no  │
#   │    │                        │              │ .env/.tfstate/.gguf/crash log │
#   │    │                        │              │ or model weight is IN THE     │
#   │    │                        │              │ INDEX, and none of 5 credential│
#   │    │                        │              │ shapes is in tracked content  │
#   │ 2  │ terraform-validate     │ hygiene.yml  │ both stacks fmt/init/validate  │
#   │    │                        │              │ — NO AWS CONTACT OF ANY KIND   │
#   │ 3  │ tier-classification    │ tests.yml    │ every collected test is in    │
#   │    │                        │              │ exactly one of T1/T2/T3; no   │
#   │    │                        │              │ test left unclassified        │
#   │ 4  │ t1-service-free        │ tests.yml    │ the 90 service-free tests,    │
#   │    │                        │              │ with 0 skips and 0 xfails     │
#   │ 5  │ t2-database            │ tests.yml    │ the 28 tests against a        │
#   │    │                        │              │ disposable pgvector, same     │
#   └────┴────────────────────────┴──────────────┴────────────────────────────────┘
#   (Job 1 runs TWO checks — forbidden-paths-tracked and secrets-in-tracked-
#   content — as two steps. They are one job, so they are one gate here: the
#   count of five is the count of JOBS, which is what `needs:` actually waits on.)
#
# SIXTH GATE, NOT ON `main`: T3 (the 28 live-stack tests) is still not in CI, for
# the reasons tests.yml's header gives at length. A green release run is
# therefore NOT a claim that all 146 tests pass. It is a claim about 118.
#
# ── WHY `terraform-validate` IS COVERED BY `needs: [hygiene]` ────────────────
# THIS COMMENT IS LOAD-BEARING. DO NOT "OPTIMISE" THE TERRAFORM GATE AWAY.
#
# Gate 2 (`terraform-validate`) is a JOB INSIDE `hygiene.yml`, not a job of this
# workflow. Nothing named `terraform-validate` appears below, and that is
# correct — but it is also easy to misread this file as though the Terraform
# gate were absent, and then to "simplify" `needs: [hygiene, tests]` down to
# `needs: [tests]` or drop the `hygiene` call entirely as redundant-looking.
# That edit would silently delete gate 2, and nothing in the resulting file
# would still say so.
#
# The dependency is transitive and it is total: a job that calls a reusable
# workflow with `uses:` succeeds ONLY IF EVERY JOB INSIDE THAT WORKFLOW
# SUCCEEDED. `hygiene.yml` contains exactly two jobs — `state-leak-gate`
# (gate 1) and `terraform-validate` (gate 2) — so a green `hygiene` job here is
# a green terraform validation. There is no configuration of the `hygiene` call
# that brings in one job and not the other; `uses:` is all-or-nothing per
# workflow. The same is true of `tests.yml`, which contributes gates 3, 4 and 5.
#
# The five gates are therefore not "all" because they are listed five times
# below. They are "all" because `build` needs BOTH reusable-workflow calls, and
# each call is a conjunction over its own jobs. Removing any gate means editing
# `hygiene.yml` or `tests.yml` — where the gate still has its own name,
# documentation and owner — not editing a `needs:` list here.
#
# ═════════════════════════════════════════════════════════════════════════════
# WHY `needs:`, AND WHY NOT `workflow_run`
# ═════════════════════════════════════════════════════════════════════════════
# The obvious alternative is: let hygiene.yml and tests.yml keep their
# `push: branches: [main]` triggers, and add a `workflow_run` workflow that
# fires "when hygiene/tests complete" and publishes. It was not used. Four
# reasons, in order of how much damage each would do:
#
#   1. `workflow_run` DOES NOT GATE ON THE RESULT. A `workflow_run` trigger
#      fires on COMPLETION — success, failure or cancellation — and the
#      triggering run's conclusion is a plain boolean the downstream job must
#      remember to inspect. Get that check wrong, or let it drift, and the
#      image publishes on a red run. `needs:` has no equivalent failure mode:
#      a dependency that did not succeed does not run, full stop. The gate is
#      structural rather than remembered.
#   2. `workflow_run` MATCHES ON WORKFLOW NAME AND STATUS, NOT ON REVISION.
#      Its `branches` filter selects which workflow runs can trigger it; it
#      does not bind the downstream run to the SAME COMMIT SHA. Publishing then
#      requires checking out `github.sha` and proving it equals the triggering
#      run's sha — a manual, fallible, silently-wrong-if-omitted step. `needs:`
#      runs in one workflow on one SHA, so "the image is built from the
#      revision that passed" is true by construction.
#   3. `workflow_run` RUNS ON A DIFFERENT WORKFLOW, WHICH FORCES A SECOND
#      CHECKOUT AND A SECOND ARTIFACT HAND-OFF. To inspect the image that was
#      tested, or to hand it to the publish job, something must cross the run
#      boundary — and the only supported mechanism is an artifact upload whose
#      provenance nobody checks. That is precisely the gap this workflow is
#      built to close (see THE TWO-JOB BUILD/PUBLISH SPLIT below).
#   4. `workflow_run` ALSO NEEDS A REST POLLING FALLBACK, or it silently stops
#      working. Its `types` filter covers `completed` and `requested`; there is
#      no "succeeded" event, so a workflow that only reacts to success has to
#      detect failure some other way. `needs:` has one event and one meaning.
#
# The operator's instruction was also explicit: no `workflow_run`, no REST
# polling. What follows is the dependency-graph version of the same idea.
#
# ═════════════════════════════════════════════════════════════════════════════
# WHY THE TWO VERIFICATION WORKFLOWS LOST THEIR `push: branches: [main]`
# ═════════════════════════════════════════════════════════════════════════════
# Both hygiene.yml and tests.yml now declare `workflow_call` and NO `push`
# trigger. On a PULL REQUEST they still run directly, exactly as before, so
# review is entirely unaffected. On `main` this workflow calls them instead.
#
# Leaving the push triggers in place would have produced TWO full runs per merge
# — one set triggered directly, one set nested inside release — meaning two
# terraform validations, two suites, and two independent verdicts about one
# revision, with no principled way to say which one actually gated the published
# image. One event, one set of runs. The gates did not become optional on
# `main`; they became BLOCKING (via `needs:`) instead of advisory.
#
# ═════════════════════════════════════════════════════════════════════════════
# THE TWO-JOB BUILD/PUBLISH SPLIT — WHY IT IS TWO JOBS AND NOT ONE
# ═════════════════════════════════════════════════════════════════════════════
# THE PROBLEM THIS SOLVES. An image must be INSPECTED before it is PUBLISHED,
# and inspection needs the image to exist somewhere inspectable. Building
# straight to the registry with `push: true` makes the only inspectable copy
# live in GHCR — so either the registry is trusted before it is verified, or the
# image is rebuilt after verification, and a REBUILD IS NOT THE SAME IMAGE.
# That second option is the trap: build twice, gate the first, push the second,
# and the claim "we published what we inspected" is false in a way no log
# reveals.
#
# THE SOLUTION. `build` loads the image into the runner's local Docker daemon,
# inspects THAT image, and `docker save`s it to a tarball artifact. `publish`
# downloads that exact tarball, loads it, and pushes it. The bytes that were
# inspected and the bytes that are published are THE SAME BYTES, in the same
# format, passed through a tarball. There is no rebuild and no second build
# step, so "inspected == published" is not a claim this workflow makes — it is
# a property it cannot violate.
#
# The `publish` job re-checks the loaded image's ID against the digest `build`
# emitted. If the artifact were ever substituted, truncated, or resolved to a
# different image, that comparison fails and nothing is pushed.
#
# ═════════════════════════════════════════════════════════════════════════════
# PERMISSIONS — `packages: write` EXISTS ON EXACTLY ONE JOB
# ═════════════════════════════════════════════════════════════════════════════
#   hygiene, tests, build : contents: read
#   publish               : contents: read, packages: write
#
# `build` runs third-party actions (docker/build-push-action and its setup
# chain) and executes code from a repository that accepts pull requests. It
# holds NO credential that could write a package, let alone one that could reach
# AWS. The token that can push to GHCR is introduced for the first time in
# `publish`, whose only step that could be influenced by untrusted code is
# `docker load` of an artifact this workflow itself produced two jobs earlier —
# not by anything from a pull request. A PR can never reach `publish` at all
# (see THE PULL-REQUEST CANNOT PUBLISH section below).
#
# No job anywhere in this file holds `id-token: write`. There is no OIDC-to-AWS
# exchange in this milestone's CI, and a credential-exchange permission must
# never ride along on a build that has not measured its need for it. Stage 5 is
# where deployment happens, and it will need to make that argument explicitly.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Workflow-level default is the most restrictive thing that still lets anything
# run. Every job below either inherits this or narrows it.
permissions:
  contents: read

# One release pipeline per ref at a time. A second push to main cancels the
# first — which is safe precisely because nothing is published until every gate
# has passed, and a cancelled run publishes nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # GATES 1-2 — state-leak (both checks, one job) and terraform-validate.
  # A job that calls a reusable workflow succeeds only if EVERY job inside it
  # succeeded. `hygiene.yml` has exactly two jobs, so this single green job is
  # gate 1 AND gate 2. See the load-bearing comment at the top of this file
  # before removing this `needs:` entry or this `uses:` — dropping `hygiene`
  # here silently deletes the terraform gate.
  # ═════════════════════════════════════════════════════════════════════════
  hygiene:
    name: gates 1-2 (state-leak, secrets, terraform)
    uses: ./.github/workflows/hygiene.yml
    permissions:
      contents: read

  # ═════════════════════════════════════════════════════════════════════════
  # GATES 3-5 — tier classification, T1 (service-free), T2 (disposable
  # pgvector). Same all-or-nothing property as `hygiene` above.
  #
  # T3 IS NOT RUN AT ALL — not a gate here, not a sixth gate anywhere. The 28
  # live-stack tests are still not in CI, for the reasons tests.yml's header
  # gives at length. A green run of this pipeline is therefore NOT a claim that
  # all 146 tests pass. It is a claim about 118. (The sixth gate in this file is
  # the image-content gate in the `build` job, which is a different thing
  # entirely.)
  # ═════════════════════════════════════════════════════════════════════════
  tests:
    name: gates 3-5 (tier classification, T1, T2)
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  # ═════════════════════════════════════════════════════════════════════════
  # BUILD + INSPECT — no publish credential on this job.
  # ═════════════════════════════════════════════════════════════════════════
  build:
    name: build and inspect the image
    needs: [hygiene, tests]
    # contents: read ONLY. This job builds from a repository that accepts pull
    # requests and runs vendored build actions. It must not be able to write a
    # package — see "PERMISSIONS" above.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.refs.outputs.repository }}
      sha_tag: ${{ steps.refs.outputs.sha_tag }}
      main_tag: ${{ steps.refs.outputs.main_tag }}
      image: ${{ steps.refs.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      # The registry name is derived, never typed, so a fork or a repository
      # rename cannot leave a hardcoded owner in a file nobody re-reads.
      # Lowercased because GHCR requires a lowercase path and a repository owner
      # may contain uppercase characters.
      - name: resolve the image reference
        id: refs
        # Via `env:`, never `${{ }}` interpolated into the script body — an
        # expression pasted into a shell command is an injection seam, and this
        # value never needs to be one.
        #
        # SOURCE_URL is derived the same way REPOSITORY is, and for the same
        # reason: it becomes `org.opencontainers.image.source` on the published
        # image, which is a machine-readable pointer at the code an image came
        # from. A hardcoded `https://github.com/fvitorino00/lemondrop` would be
        # wrong the moment this repository is cloned by anyone else, and it would
        # be wrong INSIDE the published artifact, where nobody would be left to
        # notice and correct it. SERVER_URL rather than a literal scheme+host,
        # because GitHub Enterprise Server has a different one.
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="ghcr.io/${owner}/lemondrop-api"
          sha_tag="${repository}:${GITHUB_SHA}"
          main_tag="${repository}:main"
          source_url="${SERVER_URL}/${REPO_NAME}"
          # The full, unabbreviated commit. `github.sha` for a `push` to main is
          # the merge commit that was pushed; `GITHUB_SHA` is the same value by
          # definition and is used here so no expression syntax appears here.
          # An abbreviated sha would be a strictly worse label — several
          # repositories will grow commits sharing a short prefix, and an
          # unresolvable "which tree is this?" is the problem labels exist to
          # remove.
          source_revision="${GITHUB_SHA}"
          {
            echo "repository=${repository}"
            echo "sha_tag=${sha_tag}"
            echo "main_tag=${main_tag}"
            echo "image=${sha_tag}"
            echo "source_url=${source_url}"
            echo "source_revision=${source_revision}"
          } >> "$GITHUB_OUTPUT"
          echo "repository      : ${repository}"
          echo "sha tag         : ${sha_tag}"
          echo "main tag        : ${main_tag}"
          echo "source url      : ${source_url}"
          echo "source revision : ${source_revision}"

      # ── THE ALEMBIC SCHEMA HEAD, DERIVED AT BUILD TIME ─────────────────────
      # ── WHY THIS STEP EXISTS, AND WHY IT IS NOT OPTIONAL ───────────────────
      # scripts/deploy.sh has to answer one question before it will deploy
      # anything: "does this image expect a database schema different from the
      # one this host is already at?" It cannot ask the image (api/Dockerfile
      # copies `app/` only, and alembic is deliberately absent from
      # api/requirements.txt, so the image holds no migration tooling and no
      # `alembic/versions/`), it cannot ask the database (this role has no DDL
      # credential and must never have one — see infra/iam.tf), and it will not
      # guess. So it falls back to reading the schema out of a named source
      # revision's git tree, which means the operator has to NAME that revision
      # on the command line.
      #
      # Labelling the image removes that requirement, and ONLY if the label is
      # the real schema head. A hardcoded head is not a label, it is a stale
      # constant that agrees with the image until the first migration lands and
      # then fails closed forever, in a way nobody can see from the image.
      # Hence: computed here, from this tree, by the migration tooling itself.
      #
      # ── WHY `alembic heads` AND NOT A REIMPLEMENTATION ──────────────────────
      # The set of `revision` values minus the set of non-None `down_revision`
      # values is a two-line `sed` pipeline, and it is what
      # scripts/lib/deploy-lib.sh:alembic_head_at_revision does on the deploy
      # host. It was not used here. Two reasons, and the first is the one that
      # matters:
      #
      #   1. It is a reimplementation of alembic's graph walk, so it agrees with
      #      alembic until it does not — a `down_revision` written as a tuple, a
      #      `depends_on`, a merge migration, a `base` root. At which point the
      #      label and the deploy host's answer are two different numbers for the
      #      same tree, and the deploy refuses for a reason nobody can reconstruct.
      #   2. `alembic heads` is the project's own tooling reading its own config
      #      (api/alembic.ini), its own `script_location`, its own
      #      `file_template`. It is also the command an operator runs to ask
      #      this question by hand, so a label and a manual check cannot diverge
      #      because they are not the same code path.
      #
      # It opens no database and does not run `env.py` — it walks the script
      # directory — so no `ALMBIC_DATABASE_URL` is needed or consulted. Proven
      # locally: `alembic -c api/alembic.ini heads` exits 0 on a tree whose only
      # migration is `0001`.
      #
      # ── WHY NOT `-r api/requirements-dev.txt` ───────────────────────────────
      # It would work, and it is the obvious thing to reach for. It also
      # installs fastapi, uvicorn, httpx, pytest and requests to answer a
      # question none of them participate in. Those five are ~15MB of download
      # and a class of failure (a transitive resolution problem in a package the
      # label does not depend on) that would break the release for a reason that
      # has nothing to do with the image.
      #
      # So only what alembic needs is installed, at the SAME pins the repository
      # already declares — and because a pin written twice is a pin that will
      # drift, the first thing this step does is ASSERT that the pins it is
      # about to use are still the pins in api/requirements-dev.txt and
      # api/requirements.txt. If someone bumps alembic there and forgets this
      # file, the release fails with a sentence about that, instead of quietly
      # computing a head with a different version of the migration tooling than
      # the one the project develops against.
      #
      # SQLAlchemy is installed because `import alembic` imports it — verified:
      # `pip install --no-deps alembic` produces a ModuleNotFoundError before
      # `heads` ever runs. Its version does not affect the answer (the command
      # walks the script directory), but an unpinned transitive in a repository
      # whose stated rule is "exact pins, no ranges, ever" is not acceptable
      # just because it happens not to matter today.
      #
      # ── WHY INSTALLING ANYTHING HERE IS ACCEPTABLE ──────────────────────────
      # This is a BUILD STEP on the RUNNER. The venv lives in a temp directory
      # on the runner's filesystem and is thrown away; nothing from it enters
      # the image, because api/Dockerfile installs api/requirements.txt and
      # nothing else, and the build context is `./api`. The only thing that
      # crosses from this step into the image is three strings, passed as
      # `--label` metadata below. A build job having more Python available than
      # the artifact it builds is the normal case, not a leak.
      - name: resolve the alembic schema head
        id: schema
        # Via `env:`, never `${{ }}` in the script body — the same injection-seam
        # rule the step above states.
        env:
          SOURCE_REVISION: ${{ steps.refs.outputs.source_revision }}
        run: |
          set -euo pipefail

          # ── THE PIN-DRIFT ASSERTION, FIRST ──────────────────────────────────
          # Before the venv exists, so a drifted pin costs nothing.
          grep -qE '^alembic==1\.20\.0$' api/requirements-dev.txt || {
            echo "::error title=schema head::api/requirements-dev.txt no longer pins alembic==1.20.0; the pins this step installs are now a second, drifting copy of the same fact. Update them together."
            exit 1
          }
          grep -qE '^SQLAlchemy(\[[^]]*\])?==2\.0\.54$' api/requirements.txt || {
            echo "::error title=schema head::api/requirements.txt no longer pins SQLAlchemy==2.0.54; same drift problem as alembic above. Update them together."
            exit 1
          }

          venv="$(mktemp -d)"
          trap 'rm -rf "$venv"' EXIT
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check \
            "alembic==1.20.0" "SQLAlchemy==2.0.54"

          # ── THE ANSWER, AND THE ASSERTION THAT MAKES IT AN ANSWER ───────────
          # Every failure below is a build failure, not a warning. The whole
          # point of this change is that a deploy host must not have to be told
          # a schema head by a human; a build that quietly ships an image whose
          # schema label is empty, or says "base", or is one of two heads of a
          # branched history, reintroduces exactly the operator-supplied-argument
          # problem this label exists to remove — with the extra damage of
          # looking like it was solved.
          heads_output="$("$venv/bin/alembic" -c api/alembic.ini heads 2>&1)" || {
            echo "::error title=schema head::\`alembic -c api/alembic.ini heads\` failed; the alembic history of this tree could not be read."
            printf '%s\n' "$heads_output"
            exit 1
          }
          printf 'alembic heads : %s\n' "$heads_output"

          # EXACTLY ONE head. Zero means the tree declares no migrations at all
          # (an empty `api/alembic/versions/`) — verified against a real empty
          # tree, where `alembic heads` prints nothing and exits 0, which is
          # precisely why "exited 0" is not an assertion. More than one means a
          # branched migration history, which has no single head to put in a
          # label at all; both are refusals, and neither is a warning.
          head_count="$(printf '%s\n' "$heads_output" | grep -c '(head)$' || true)"
          if [ "$head_count" -ne 1 ]; then
            echo "::error title=schema head::expected exactly 1 alembic head in this tree, found ${head_count}. A branched or empty migration history cannot be expressed as one label."
            printf '%s\n' "$heads_output"
            exit 1
          fi

          # Strip the ` (head)` suffix alembic prints, and reject anything that
          # is not a single plausible revision identifier. This is the last
          # chance to notice that the parsing — not alembic — is what went
          # wrong.
          alembic_head="$(printf '%s\n' "$heads_output" | sed -n 's/^\([A-Za-z0-9_.-]\{1,\}\) (head)$/\1/p' | head -n 1)"
          case "$alembic_head" in
            ''|base)
              echo "::error title=schema head::the resolved alembic head is '${alembic_head:-<empty>}', which is not a real revision id."
              exit 1 ;;
          esac

          echo "alembic_head=${alembic_head}" >> "$GITHUB_OUTPUT"
          {
            echo "### schema head"
            echo
            echo "- source revision (\`org.opencontainers.image.revision\`): \`${SOURCE_REVISION}\`"
            echo "- alembic head (\`org.lemondrop.alembic-head\`): \`${alembic_head}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      # ── WHY `load: true` AND `push: false` ─────────────────────────────────
      # `load: true` puts the finished image into this runner's local Docker
      # daemon, which is what makes it INSPECTABLE: the content gate below runs
      # `docker run` against the real, built, runnable image. `push: false` is
      # what keeps the registry out of it. The previous design — build with
      # `load: false`, then describe a filesystem scan — never said how the
      # image became inspectable and never established that the inspected image
      # was the published one.
      #
      # `provenance: false` is REQUIRED, not a nicety. Provenance/SBOM
      # attestations are separate manifest entries in the OCI index that only
      # exist on a PUSHED image; they are not preserved by `load: true`. Leaving
      # them on would make buildkit print a digest for an artifact that does not
      # describe the thing that was loaded, which is exactly the kind of
      # confident, wrong digest that later gets written into a runbook.
      #
      # `context: ./api` is the primary control on what can enter the image:
      # `models/`, `.git/`, `.terraform/` and the repository `.env` are outside
      # the context and are unreachable by any COPY. `api/.dockerignore` is the
      # second layer, covering a `.env` or key dropped into `api/app/`.
      #
      # ── THE LABELS ─────────────────────────────────────────────────────────
      # Three strings. What each one is FOR is the whole content of this block,
      # because the tempting mistake here is to squeeze two different facts into
      # one label and let the deploy host work out which one it got.
      #
      # `org.opencontainers.image.revision` — PROVENANCE. Which commit's tree
      # this image was built from. Standard, in the standard vocabulary, and
      # derived from `github.sha`, never typed.
      #
      # `org.opencontainers.image.source` — the repository the code came from.
      # Standard, and derived from `github.server_url` + `github.repository`
      # rather than hardcoded, so a fork's published image points at the fork
      # instead of at a URL that describes someone else's code.
      #
      # `org.lemondrop.alembic-head` — SCHEMA COMPATIBILITY. Which alembic
      # revision's schema this image's code expects to find in the database.
      #
      # ── WHY THE SCHEMA LABEL IS NOT AN `org.opencontainers.*` ANNOTATION ────
      # Because the git commit SHA IS NOT AN ALEMBIC REVISION, and every pair of
      # those labels describes two independent facts:
      #
      #   * provenance answers "what code is this?" — a VCS identity, resolvable
      #     in a browser, meaningful to a human reading a digest on a registry
      #     page years later;
      #   * schema compatibility answers "what table shape does this code need?"
      #     — an identity in a SEPARATE versioning scheme, whose values are
      #     chosen by migration authors and mean nothing whatsoever outside this
      #     repository's `api/alembic/versions/`.
      #
      # A commit can ship without moving the head (a revert, a squashed branch, a
      # README change) and a single commit can move the head more than once. So
      # the mapping between the two is neither injective nor total, and any
      # consumer that derives one from the other is deriving a guess. Both facts
      # are therefore carried, and scripts/lib/deploy-lib.sh reads them as two
      # separate things and refuses when they disagree.
      #
      # `org.opencontainers.image.version` is the specific trap avoided here. It
      # is the conventional place for "the version of this software", it is what
      # scanners and dashboards read, and a consumer seeing `0001` there would
      # reasonably conclude that every `0002` is a release. This repository has
      # no release numbering of its own and CI does not invent one, so writing a
      # schema revision into the version field would be a claim about the
      # software's identity that is not true. Hence a Lemondrop-specific key in
      # Lemondrop's own namespace: unowned, unambiguous, and impossible to
      # confuse with a standard annotation by a tool that only knows the
      # standard ones.
      #
      # Labels are OCI image CONFIG metadata — plain strings in the config JSON,
      # set by the builder and carried by `docker save`/`docker load` and by
      # `docker push`. They are NOT attestations: `provenance: false` above is
      # unaffected by this, and nothing here is a cryptographic claim. These are
      # statements the builder makes, which is why the assertion step below
      # checks that the builder actually made them.
      - name: build the image into the local daemon
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: api/Dockerfile
          load: true
          push: false
          provenance: false
          tags: ${{ steps.refs.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ steps.refs.outputs.source_revision }}
            org.opencontainers.image.source=${{ steps.refs.outputs.source_url }}
            org.lemondrop.alembic-head=${{ steps.schema.outputs.alembic_head }}

      # ── THE LABEL ASSERTION ─────────────────────────────────────────────────
      # NOT A GATE. It is in this job, not in the five-gate accounting above, for
      # the same reason the digest step below is not a gate: it is a check on the
      # thing this job exists to produce. Nothing here changes what is published;
      # it changes whether this job claims to have produced something real.
      #
      # WHY THE STEP ABOVE'S ASSERTION IS NOT ENOUGH. Resolving the head in the
      # shell proves a string was computed. It does not prove the string reached
      # the image: a typo in a label key, a `labels:` block that build-push-action
      # silently ignores, an empty step output, and every one of them produce a
      # perfectly good image carrying NO schema label — which is precisely the
      # state this change exists to end. So the assertion is made against the
      # built artifact, by the same mechanism scripts/deploy.sh will use to read
      # it (`docker image inspect` over `.Config.Labels`), so a build that would
      # not serve the deploy host is a build that fails here.
      #
      # BOTH FACTS ARE CHECKED, AND NEITHER IS CHECKED AGAINST THE OTHER. The
      # revision is compared against the value the previous step resolved; the
      # head is compared against its own. `revision == head` is neither expected
      # nor tested — they are different namespaces and comparing them would be
      # the conflation this whole change is written to avoid.
      - name: assert the built image carries its labels
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          EXPECTED_REVISION: ${{ steps.refs.outputs.source_revision }}
          EXPECTED_SOURCE: ${{ steps.refs.outputs.source_url }}
          EXPECTED_ALEMBIC_HEAD: ${{ steps.schema.outputs.alembic_head }}
        run: |
          set -euo pipefail
          failed=0

          # `range` over `.Config.Labels`, so ONE `docker image inspect` renders
          # every label and the three checks below share it. `{{index .Config.Labels
          # "k"}}` also works — verified on Docker 29.8.2 against an image whose
          # labels map is nil, where it returns empty and exits 0 — but it is one
          # inspect call per label.
          #
          # `|| true` because `docker image inspect` exits non-zero for an image
          # that is not here, and the interesting failure below is precisely
          # "the labels are not what I expected", which must be a readable
          # error and not a `set -e` abort on the pipeline.
          actual="$(
            docker image inspect \
              --format '{{range $k, $v := .Config.Labels}}{{printf "%s=%s\n" $k $v}}{{end}}' \
              "$IMAGE" 2>/dev/null || true
          )"
          label_value() {
            printf '%s\n' "$actual" | sed -n "s/^${1}=//p" | head -n 1
          }

          {
            echo "### image labels"
            echo
            if [ -n "$actual" ]; then
              printf '%s\n' "$actual" | sed 's/^/- `/;s/$/`/'
            else
              echo "- \<none — this image carries no labels at all\>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for check in \
            "org.opencontainers.image.revision:${EXPECTED_REVISION}" \
            "org.opencontainers.image.source:${EXPECTED_SOURCE}" \
            "org.lemondrop.alembic-head:${EXPECTED_ALEMBIC_HEAD}"
          do
            key="${check%%:*}"
            want="${check#*:}"
            got="$(label_value "$key")"
            if [ -z "$got" ]; then
              echo "::error title=image label::${IMAGE} has no '${key}' label. A deploy host would have to be told this by hand, which is the limitation these labels remove."
              failed=1
            elif [ "$got" != "$want" ]; then
              echo "::error title=image label::${IMAGE} carries '${key}=${got}' but the build resolved '${want}'."
              failed=1
            fi
          done

          # Belt and braces on the one label whose absence is a SCHEMA problem
          # rather than a convenience problem. An empty alembic-head must never
          # survive this step: scripts/deploy.sh treats an empty label as "this
          # image predates label support" and falls back, which is the correct
          # behaviour for an old digest and the wrong behaviour for a new one.
          if [ "$(label_value 'org.lemondrop.alembic-head')" = "" ]; then
            echo "::error title=image label::refusing to publish an image with an empty schema label."
            failed=1
          fi

          exit "$failed"

      # ── GATE 6: THE IMAGE CONTENT GATE ─────────────────────────────────────
      # Runs INSIDE the built image, with the image's own Python, against the
      # image's own filesystem. `find` and `grep` may not exist in a
      # python:3.12-slim image; `python` is guaranteed to.
      #
      # The gate is piped in on STDIN rather than bind-mounted. That is a
      # deliberate choice, not a stylistic one: a mounted copy of the script
      # would itself be a file inside the filesystem being scanned, and would
      # then need to be excluded from its own scan — which is a blind spot
      # written into the gate to accommodate the gate. On stdin the script
      # never exists inside the scanned tree, so there is nothing to excuse.
      #
      # `set -euo pipefail` is what turns a red gate into a red JOB. Without it
      # a non-zero from `docker run` would be discarded and this step would
      # report success on a failed gate.
      - name: image content gate
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python "$IMAGE" - \
            < .github/workflows/image-content-gate.py

      # The digest of the image that was just INSPECTED. `docker image inspect
      # .Id` is the sha256 of the image config — a genuine content address of
      # the exact bytes `docker save` serialises below, computed locally with no
      # registry involved.
      #
      # STATED PRECISELY: this is NOT the registry manifest digest. Only
      # `publish` can know that, and only `publish` records it. This value is
      # used for the artifact-identity check between the two jobs, which is
      # exactly what it is good for.
      - name: record the inspected image digest
        id: digest
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
        run: |
          set -euo pipefail
          digest="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          if [ -z "$digest" ]; then
            echo "::error title=image digest::could not read a digest for $IMAGE; the artifact identity check in publish has nothing to compare against."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### build"
            echo
            echo "- image: \`${IMAGE}\`"
            echo "- inspected image ID (sha256 of the image config): \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── THE HAND-OFF ───────────────────────────────────────────────────────
      # `docker save` + gzip + artifact upload is what makes "the bytes that
      # were inspected are the bytes that get pushed" a mechanical fact rather
      # than an intention. The alternative — letting `publish` build the image
      # again — reintroduces the gap this split exists to close.
      - name: export the inspected image for publish
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/lemondrop-api-image.tar.gz"
          ls -l "$RUNNER_TEMP/lemondrop-api-image.tar.gz"

      - name: upload the image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemondrop-api-image
          path: ${{ runner.temp }}/lemondrop-api-image.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ═════════════════════════════════════════════════════════════════════════
  # PUBLISH — the only job holding `packages: write`.
  # ═════════════════════════════════════════════════════════════════════════
  publish:
    name: publish to GHCR
    needs: [build]

    # ── A PULL REQUEST CAN NEVER PUBLISH ─────────────────────────────────────
    # This workflow triggers on `push` to `main` and on `workflow_dispatch`.
    # The first cannot fire for a pull request at all. The second COULD — a
    # maintainer with write access can dispatch a workflow on any ref — so the
    # ref check below is what makes the claim true rather than nearly true.
    # Without it, this job would be one manual dispatch away from publishing an
    # unmerged branch as `ghcr.io/.../lemondrop-api:main`, overwriting the tag
    # every deployment resolves. A job that is SKIPPED is the right outcome: it
    # says "this ref does not publish", loudly, without turning an exploratory
    # manual run into a red build.
    if: github.ref == 'refs/heads/main'

    # The ONLY `packages: write` in this repository's CI. The token with
    # package-write is introduced here and touches nothing but a `docker load`
    # of the artifact `build` produced and gated two jobs earlier in the SAME
    # run, on the SAME sha.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      SHA_TAG: ${{ needs.build.outputs.sha_tag }}
      MAIN_TAG: ${{ needs.build.outputs.main_tag }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      # `RUNNER_TEMP`, not the workspace: this is a multi-hundred-megabyte file
      # and it has no business inside a checkout that `git status` will read.
      - name: download the gated image artifact
        uses: actions/download-artifact@v4
        with:
          name: lemondrop-api-image
          path: ${{ runner.temp }}

      - name: load the exact artifact that was inspected
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lemondrop-api-image.tar.gz"
          if [ ! -f "$archive" ]; then
            echo "::error title=publish artifact::no image archive at $archive; refusing to build one, because a rebuild is not the image that was inspected."
            exit 1
          fi
          gunzip -c "$archive" | docker load

      # ── THE ARTIFACT IDENTITY CHECK ────────────────────────────────────────
      # This is the step that makes the two-job split worth having. The loaded
      # image must have the SAME ID as the image `build` inspected. If the
      # artifact were substituted, truncated, or resolved to something else,
      # this fails and nothing is pushed.
      #
      # Note what this step deliberately does NOT do: it does not rebuild. A
      # `docker build` here would be a new image that merely looks like the
      # gated one, which is the exact failure mode the split was designed to
      # make impossible.
      - name: verify the loaded artifact IS the inspected image
        run: |
          set -euo pipefail
          actual="$(docker image inspect --format '{{.Id}}' "$SHA_TAG")"
          echo "build inspected : ${EXPECTED_DIGEST}"
          echo "publish loaded  : ${actual}"
          if [ "$actual" != "$EXPECTED_DIGEST" ]; then
            echo "::error title=artifact identity::the loaded image is NOT the image that passed the content gate (expected ${EXPECTED_DIGEST}, got ${actual}). Refusing to publish."
            exit 1
          fi
          echo "artifact identity: PASS — the image about to be published is byte-for-byte the image the content gate inspected."

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── WHY THERE IS A `docker tag` HERE AT ALL (RUN 38572006061) ────────────
      # THIS STEP IS THE FIX. Release run 38572006061 pushed the SHA tag
      # successfully and then FAILED on the very next line with:
      #
      #     tag does not exist: ghcr.io/fvitorino00/lemondrop-api:main
      #
      # The cause is structural, not a typo. The `build` job tags the image ONLY
      # as `${sha_tag}` (`tags: ${{ steps.refs.outputs.image }}`), because that
      # is all the content gate and the `docker save` need. So the runner's
      # daemon holds exactly ONE reference. `docker push "$MAIN_TAG"` was then
      # asked to push a reference that no local image was named by; the daemon
      # could not resolve it locally, so the CLI treated it as a bare registry
      # reference, and the registry — which had never been given that tag —
      # rejected it. The SHA image was already published when the run died, and
      # the `main` pointer was never moved.
      #
      # `docker tag "$SHA_TAG" "$MAIN_TAG"` is the fix, and it is the RIGHT fix
      # for a reason that matters more than making the command stop failing: it
      # creates a second NAME for the image the artifact-identity check has
      # already verified, in this daemon, on this runner. It does NOT rebuild,
      # and it does not re-resolve anything from the registry — so both names
      # are, by construction, the same bytes the content gate ran against.
      # That is what turns "both tags resolve to the inspected image" from an
      # assumption into a property. The alternative repair — building or pulling
      # a second image to tag as `main` — would be a DIFFERENT image, and would
      # reintroduce exactly the inspected-equals-published gap that the
      # two-job split exists to close.
      #
      # The equality check below is not decoration. `docker tag` is an assertion
      # by Docker, not by this script; if anything ever retargeted `MAIN_TAG`
      # between the two lines, the two `.Id` values would diverge and the step
      # fails BEFORE either push. Reading both back is one cheap inspect each.
      - name: push the sha and main tags
        run: |
          set -euo pipefail
          # The artifact-identity check above has already passed and is not
          # repeated, reordered or weakened here.
          docker tag "$SHA_TAG" "$MAIN_TAG"

          sha_id="$(docker image inspect --format '{{.Id}}' "$SHA_TAG")"
          main_id="$(docker image inspect --format '{{.Id}}' "$MAIN_TAG")"
          echo "sha reference : ${SHA_TAG}"
          echo "main reference: ${MAIN_TAG}"
          echo "sha  image ID : ${sha_id}"
          echo "main image ID : ${main_id}"
          if [ "$sha_id" != "$main_id" ]; then
            echo "::error title=tag identity::the local 'docker tag' did not produce two names for one image (${SHA_TAG} -> ${sha_id}, ${MAIN_TAG} -> ${main_id}). Refusing to push: the main tag would not be the image that passed the content gate."
            exit 1
          fi
          echo "tag identity  : PASS — both tags name the one inspected image (${sha_id})."

          docker push "$SHA_TAG"
          docker push "$MAIN_TAG"

      # ── THE AUTHORITATIVE DIGEST — NOW A HARD REQUIREMENT ──────────────────
      # After a successful push, the local image carries `RepoDigests`, whose
      # entries are `ghcr.io/<owner>/lemondrop-api@sha256:<manifest digest>`
      # — the registry's own content address for what it just stored. That is
      # the value worth recording, and it is recorded HERE because this is the
      # only job that can observe it.
      #
      # ── IT IS A DIFFERENT VALUE FROM `EXPECTED_DIGEST`, AND IS NEVER SWAPPED
      # ── WITH IT. `EXPECTED_DIGEST` is `docker image inspect .Id`: the LOCAL
      # image-config ID, a content address of the image `build` inspected. It
      # is what the artifact-identity check compares, and it is the right value
      # for that job because it needs no registry. The registry manifest digest
      # is a DIFFERENT hash, computed by the registry over the manifest it
      # stored, and it is the only value any deployment can pin to. Writing the
      # local ID into the "published digest" field would be a correctness bug,
      # not a cosmetic one — so `$EXPECTED_DIGEST` appears nowhere below.
      #
      # ── WHY THIS FAILS THE RUN NOW. This step used to emit a `::warning` and
      # ── write the literal string `(unavailable on this runner)`, which let a
      # ── release succeed having recorded no digest at all. A Stage 4 acceptance
      # ── that cannot cite a digest is an acceptance of an assertion, and
      # ── `(unavailable on this runner)` is not evidence of anything. An absent
      # ── or malformed digest is now a hard failure: if this step does not
      # ── print a validated digest, the pipeline does not go green.
      #
      # `RepoDigests` can carry one entry per tag reference that image has been
      # pulled/pushed under, so this does not blindly take index [0]. It selects
      # the entry whose repository part is exactly this repository — derived from
      # "$SHA_TAG" rather than typed, for the same reason `refs` derives it.
      - name: record the pushed digest
        run: |
          set -euo pipefail
          repository="${SHA_TAG%:*}"   # ghcr.io/<owner>/lemondrop-api — derived, never typed
          expected_shape="${repository}@sha256:<64 lowercase hex characters>"

          reject() {
            echo "::error title=pushed digest::$1"
            exit 1
          }

          raw="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$SHA_TAG" 2>/dev/null || true)"
          if [[ -z "${raw//[[:space:]]/}" ]]; then
            reject "RepoDigests carried no entry at all for ${SHA_TAG} after a successful push; expected ${expected_shape}. Stage 4 is not acceptable without digest evidence, so this run fails rather than recording a placeholder."
          fi

          # Select the entry naming THIS repository, and refuse placeholders on
          # sight. RepoDigests is a list of repository@digest references, one per
          # name the image has been pushed or pulled under, so the entry wanted
          # is located by its repository half rather than by position.
          repo_digest=""
          while IFS= read -r entry; do
            entry="${entry%$'\r'}"
            case "$entry" in
              "<no value>"|"(unavailable on this runner)")
                reject "read the placeholder '${entry}' for ${SHA_TAG}; expected ${expected_shape}. A placeholder is not a digest." ;;
            esac
            [ "${entry%%@*}" = "$repository" ] || continue
            repo_digest="$entry"
            break
          done <<< "$raw"

          if [ -z "$repo_digest" ]; then
            reject "no RepoDigests entry names this repository (${repository}); read '$(printf '%s' "$raw" | tr '\n' ' ')'; expected ${expected_shape}. Another repository's digest is not this repository's published digest."
          fi
          if [ "${repo_digest%%@*}" != "$repository" ] || ! [[ "${repo_digest#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            reject "read '${repo_digest}' for ${SHA_TAG}; expected ${expected_shape}. The registry digest must name THIS repository and carry a full 64-character lowercase hex sha256."
          fi
          echo "digest shape  : PASS — ${repo_digest}"

          # ── WHAT THE SHA TAG IS, AND WHAT IT IS NOT ─────────────────────────
          # `:${GITHUB_SHA}` is a NAMING CONVENTION, NOT AN IMMUTABILITY
          # GUARANTEE. GHCR offers no immutability enforcement for container
          # tags: `docker push` against an existing `:sha` tag SUCCEEDS and
          # silently OVERWRITES the manifest that tag resolves to. Nothing in
          # this workflow prevents that, and nothing in the registry prevents
          # it either. Two pushes of the same tag to different content is a
          # supported operation, not an error.
          #
          # That is exactly why the validated digest recorded above is treated
          # as the authoritative reference. A tag is a mutable POINTER; a digest
          # is the CONTENT. `docker pull ghcr.io/.../lemondrop-api@sha256:...`
          # resolves to the same bytes forever; `docker pull ...:<sha-tag>` does
          # not, after a second push.
          #
          # WHAT FOLLOWS FOR STAGE 5, stated now so it is not discovered later:
          # the deployable reference recorded on a host must be the DIGEST, not
          # the tag. A deploy script that pins a tag and calls it immutable is
          # citing a guarantee the registry does not make.
          {
            echo "### publish"
            echo
            echo "- sha tag:      \`${SHA_TAG}\`  (naming convention — **not** registry-enforced immutability; GHCR permits overwriting an existing tag)"
            echo "- main tag:     \`${MAIN_TAG}\`  (moving pointer, convenience only — never deployable)"
            echo "- **registry manifest digest (authoritative):** \`${repo_digest}\`  — the registry's own hash of what it stored; this is NOT the local image-config ID used for the artifact-identity check above, and the two values are never interchanged"
            echo
            echo "Record the digest, not the tag. A tag can be repointed by a second push; a digest cannot."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "published digest: ${repo_digest}"
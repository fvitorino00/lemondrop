# lemondrop — Alembic configuration
#
# ── WHY THIS FILE LIVES IN api/ ───────────────────────────────────────────────
# Alembic's configuration sits next to the service whose schema it owns, not at
# the repository root. The migrations belong to the `api` service: they depend on
# api/requirements.txt, they run against the database the api will use, and
# nobody else in this repo has a schema. Keeping alembic.ini inside api/ means
# `cd api && alembic upgrade head` resolves the config, the script directory and
# the interpreter from one place, with no PYTHONPATH juggling and no second
# config file at the root whose only consumer is a subdirectory.
#
# Run alembic FROM THIS DIRECTORY. See alembic/README.md.
#
# ── THE URL IS DELIBERATELY ABSENT ────────────────────────────────────────────
# There is no sqlalchemy.url below and there must never be one. A database URL
# carries a password, and a password written into a tracked file is a password
# in git history — permanently, unremovable without a rewrite. It is read from
# the ALEMBIC_DATABASE_URL environment variable instead, and env.py fails loudly
# if that variable is unset rather than falling back to a guess. The commented
# line is left here only to document the shape of what you are expected to
# export; it is inert.
#
# sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/lemondrop

[alembic]
# The directory holding env.py and versions/. %(here)s is alembic's own
# interpolation key for the absolute directory containing THIS file, which makes
# the path independent of the working directory alembic happens to be invoked
# from — the usual cause of "no such file or directory: script.py.mako".
script_location = %(here)s/alembic

# Makes the repo root importable, so `app` can be imported from here if a future
# migration needs to read the application's own metadata. Today it imports
# nothing (env.py sets target_metadata = None, and explains why), but a broken
# sys.path is a confusing failure to debug later, and setting it costs nothing.
prepend_sys_path = .

# Timestamped, filesystem-style revision filenames. Chosen over uuids because a
# chronological sort of migrations/ then matches the order they were written,
# which is the order a human needs to read them in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Migrate on every `alembic upgrade head`.
truncate_slug_length = 40

[post_write_hooks]
# Intentionally EMPTY, and that is a decision rather than an omission.
# Alembic's stock template runs `ruff` / `black` over each generated migration.
# Neither is installed or pinned anywhere in this repo — api/requirements-dev.txt
# carries `-r requirements.txt` plus alembic, pytest and requests — so shipping the
# hooks would make every `alembic revision` fail on a missing executable. Adding a
# hook later is a one-block change once the formatter is actually pinned; shipping a
# hook that cannot run is only a way to fail later, for less reason.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S